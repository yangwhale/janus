# 混元 4 其他尺寸（支线）的总览条目：格式同 items.yaml，列 = mid / B / D1 / tiny；生成 other-sizes.md。
# <列>_why 同 items.yaml。
columns:
  mid: "03 · hy4-mid 现行 C 口径（PROTOCOL 2026-11-12 前瞻登记）：L4 是 TPU tmc-a 300 步对 GPU gm-a（噪声 gm 两两 28 对）；L3 是 tmcs-c（训练步梯度，GPU 第 1 步参照只有 3 份，参照不足）；L0 学习率核对用 tmc-a，权重转换取 tm-a 一代（同一份检查点）；上一代 tm-b / tm2diag 见历代比较"
  B: "02 · real-weight 截层 B：L4 是现行 C 口径的 TPU tbc-a 1000 步（PROTOCOL 2026-11-12 前瞻登记）对 GPU gb3-a（噪声 gb3 两两 28 对）；L3 是现行 C 口径的 tb8s-c-r1（训练步梯度，GPU 第 1 步参照 6 份，PROTOCOL 2026-11-12 前瞻登记）；L0 学习率核对也用 tbc-a"
  D1: "02 · real-weight 截层 D1：L4 是现行 C 口径的 TPU tdc-a 1000 步（PROTOCOL 2026-11-12 前瞻登记）对 GPU gd3-a（噪声 gd3 两两 28 对）；L3 是现行 C 口径的 td8s-c-r2（训练步梯度，GPU 第 1 步参照 6 份，PROTOCOL 2026-11-12 前瞻登记）；L0 学习率核对也用 tdc-a"
  tiny: "00 · hy4-tiny：只有 TPU 一侧的 CPU 冒烟（8 个假 CPU 设备，四个阶段整条链路），没有 GPU 对 TPU 的比较"
groups:
  - name: L0 地基（设置 / 数据 / 权重 / 配置，必须逐位）
    items:
      - name: 设置核对：逐步学习率等于登记的常数 1e-5（两边都要）
        mid: tmc-l0-settings:L0.settings.lr
        B: t2bc-l0-settings:L0.settings.lr
        D1: t2d1c-l0-settings:L0.settings.lr
      - {name: CPU 冒烟各步（生成 HF 目录、转换、往返逐位、RoPE 去交错与负对照、训练、初始权重、数据指纹、学习率）, tiny: hy4-tiny-smoke:*}
      - name: 权重转换 → MaxText 往返逐位（含 dtype 清单）
        mid: hy4-mid-l0-ckpt-convert:*
        B: hy4-b-l0-ckpt-convert-t2:*
        D1: hy4-d1-l0-ckpt-convert:*
      - name: RoPE 列去交错与逆置换逐位
        mid: hy4-mid-l0-rope:*
        B: hy4-b-l0-rope-t2:*
        D1: hy4-d1-l0-rope:*
      - {name: 负对照：不去交错的检查点必须判不一致, tiny: hy4-cpu-smoke:L0.ckpt.rope.negative_control}
      - {name: 跨侧初始权重逐位（TPU 载入后对 GPU 初始参数清单）, mid: 'todo: 没做（与 B、D1 同样是缺口）', B: 'todo: 登记了，还没做', D1: 'todo: 登记了，还没做'}
      - {name: 每 rank 每步输入指纹（TPU 回放 GPU 的 batch）, mid: 'todo: 没做（与 B、D1 同样是缺口）', B: 'todo: 登记了，还没做', D1: 'todo: 登记了，还没做'}
      - {name: 配置逐项对照, mid: 'todo: 没做（与 B、D1 同样是缺口）', B: 'todo: 登记了，还没做', D1: 'todo: 登记了，还没做'}
  - name: L1 单算子（对 FP64；逐元素函数按 ULP）
    items:
      - {name: T0：hy4-tiny 逐层前向 / 反向对 FP64, tiny: 'todo: 待做'}
  - name: L3 第 1 步整网
    items:
      - name: 全部参数梯度：对 GPU 第 1 步噪声，超出的对 CPU FP64 定责
        mid: mid-c-step1-train-grad-vs-fp64:L3.step1.grads.vs_gpu
        mid_why: 参照不足（GPU 第 1 步参照只有 gms-a … c 三份，2026-11-12 起要 6 份，待补）；现行 C 口径 tmcs-c 不过，未定责 5 个：iHC 4 个（第 3 层 FFN 前 `hc_base` R 13.7 最大；同 hy4-mini 的 [D11](../alignments/01-mini/DETAILS.md#d11)）与第 4 层 sink（R 1.21，[根源一览第 21 行](../ROOT-CAUSES.md#r21)）；[根源一览「还没查明」](../ROOT-CAUSES.md#u-mid-step1)
        B: t2b8c-step1-train-grad-vs-fp64-n6:L3.step1.grads.vs_gpu
        B_why: 前瞻登记（PROTOCOL 2026-11-12，判法看结果之前固定、不用豁免）的判定：不过。未定责的 13 个：RMSNorm 权重 7 个（dγ 多舍一次 BF16，[根源一览第 23 行](../ROOT-CAUSES.md#r23)；开关 `rmsnorm_scale_grad_fp32` 不在对齐配置里）、第 1 层注意力前 iHC 3 个与第 0 层 FFN 前 `hc_scale`、第 1 层 sink（第 21 行）、N = 0 的索引器 `k_norm.bias`；GPU 3 份对照判定相同（[real-weight 报告 D22](../alignments/02-real-weight/ALIGNMENT-REPORT.md#d22)）
        D1: t2d18c-step1-train-grad-vs-fp64-n6:L3.step1.grads.vs_gpu
        D1_why: 前瞻登记（PROTOCOL 2026-11-12，判法看结果之前固定、不用豁免）的判定：不过。未定责的 9 个：RMSNorm 权重 4 个（[根源一览第 23 行](../ROOT-CAUSES.md#r23)）、第 0 层与 MTP 层 sink（第 21 行）、`hc_head_scale`、第 0 层 `q_b_proj`、N = 0 的索引器 `k_norm.bias`；落盘核对 57 个张量全部完好；GPU 3 份对照判定相同（[real-weight 报告 D22](../alignments/02-real-weight/ALIGNMENT-REPORT.md#d22)）
  - name: L4 多步（B、D1 1000 步；mid 300 步；都是现行 C 口径）
    items:
      - name: loss（全程）
        mid: tmc-l4:L4.loss
        mid_why: 待查：MARE 刚超线（[mid 报告 D27](../alignments/03-mid/ALIGNMENT-REPORT.md#d27)；[根源一览「还没查明」](../ROOT-CAUSES.md#u-mid-l4)）
        B: t2bc-l4:L4.loss
        D1: t2d1c-l4:L4.loss
      - name: loss 后段（第 101 步起）
        mid: tmc-l4:L4.loss.tail
        B: t2bc-l4:L4.loss.tail
        D1: t2d1c-l4:L4.loss.tail
      - name: MTP loss（全程与后段；B 没有 MTP 层）
        mid: tmc-l4:L4.mtp_loss*
        mid_why: 待查：TPU 偏高，带符号均值略超（[mid 报告 D27](../alignments/03-mid/ALIGNMENT-REPORT.md#d27)；[根源一览「还没查明」](../ROOT-CAUSES.md#u-mid-l4)）
        D1: t2d1c-l4:L4.mtp_loss*
      - name: 索引器 KD loss
        mid: tmc-l4:L4.indexer_loss
        mid_why: 待查：最大单步刚超线（[mid 报告 D27](../alignments/03-mid/ALIGNMENT-REPORT.md#d27)；[根源一览「还没查明」](../ROOT-CAUSES.md#u-mid-l4)）
        B: t2bc-l4:L4.indexer_loss
        B_why: 待查：TPU 偏低，带符号均值略超（[real-weight 报告 D21](../alignments/02-real-weight/ALIGNMENT-REPORT.md#d21)；[根源一览「还没查明」](../ROOT-CAUSES.md#u-real-weight)）
        D1: t2d1c-l4:L4.indexer_loss
        D1_why: 待查：TPU 偏高、越往后越高，M50 已开仍不过（[real-weight 报告 D21](../alignments/02-real-weight/ALIGNMENT-REPORT.md#d21)；[根源一览「还没查明」](../ROOT-CAUSES.md#u-real-weight)）
      - name: grad_norm（裁剪前）
        mid: tmc-l4:L4.grad_norm
        B: t2bc-l4:L4.grad_norm
        D1: t2d1c-l4:L4.grad_norm
      - name: param_norm（更新后参数范数，两边比精确值）
        mid: tmc-l4:L4.param_norm
        B: t2bc-l4:L4.param_norm
        D1: t2d1c-l4:L4.param_norm
      - name: 路由偏置曲线（每层均值、标准差）
        mid: tmc-l4:L4.router.*
        B: t2bc-l4:L4.router.*
        D1: t2d1c-l4:L4.router.*
        D1_why: 待查：均值最大单步略超（[real-weight 报告第 1 节](../alignments/02-real-weight/ALIGNMENT-REPORT.md#1-判定一屏)；[根源一览「还没查明」](../ROOT-CAUSES.md#u-real-weight)）
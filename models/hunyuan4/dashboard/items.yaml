# 混元 4 对齐总览的条目：每行一个检查项，只放 hy4-mini（列 gpu、mini）；其他尺寸在 other-sizes.items.yaml（格式同 models/hunyuan3/dashboard/items.yaml）。
# src = 结果名（alignments/*/results/ 下不带后缀，或 build.py 现算的 virtual 名）:检查 id 通配；几份结果合成一格时写成列表。
# todo / 「todo: 说明」= 未开始，「wip: 说明」= 有证据、还没接成正式检查，na = 不适用。通过 / 不通过只能来自结果文件。
# <列>_why: 这一格非 ✅ 时，说明里接在推导后面的一句结论与出处（根源一览第几行、对齐报告的 D 条目）；不改判定。✅ 格的 _why 不渲染，要让读者看到的话写进 <列>_say（✅ 格也照列）。
# <列>_why / <列>_say 里的数是手写副本：每个数都要能在结果文件里找到，build.py 不读它们，结果文件改了要人工复核（总览头条的数由 build.py 从结果文件读）。
# 这里只放现行比较；历代与诊断代的比较在 history.md（build.py 按 HISTORY 生成）。
columns:
  gpu: GPU 一侧自身的检查（自比、确定性、故障演练），除逐元素 log 的 ulp 实测外都未完成；mini 列用到的噪声上限 N 写在门槛栏，不在这一列。内容在 01 · mini 的 gpu-noise
  mini: 01 · hy4-mini 现行（2026-11-11 起对齐配置改 C 口径：M36、M52、M58 都开，base2 关）：L4 是 TPU tc-a（C 口径 6 份的第一份：tc-b … tc-d、tc-f 只改执行方式，tc-e 改了重算策略、反向会重选路由；含 M50）1000 步对 GPU g3-a（1000 步 golden 的基线一份；噪声 g3 16 份两两 120 对）；同一运行的前 300 步另对 GPU g2-a（前 300 步窗口 golden 的基线一份；噪声 g2 两两 28 对），两个窗口合成一格、写较差的那个；上一代（C 口径之前的 tz-off-rep）与更早的 t1zg-a 见历代比较；L0 学习率与配置逐项对照取 tc-a，TPU 初始权重对 GPU、每步输入指纹的被测是 base2 开的 t1zg-a（C 口径的 M52、M58 不加参数、不改数据回放，按机制推断结论不变；没在 tc-a 上重做）；L1 / L2 取各项最新的回放（逐层回放没有 M42b；L1 单算子回放 tw-opmini-d 与 L2 是 base2 开时测的，未在关 base2 上重测，也没有 C 口径的 M52、M58，iHC 与 hc_head 各格在 C 口径上没重判；索引器 KD 输入一格是更早的 t1z 一代（TPU 诊断程序 t1zdiag2，GPU g1p-kdd），C 口径上没重判；低阈值 QK-Clip 第 1 步逐头最大 logit 用 C 口径之前、关 base2 的 tz-off-qk01 重测过，C 口径上没重判）；L4 的 QK-Clip 用 tz-off-qkq（由 tz-off-qkc 派生每步全局最大 logit，同一运行），健康信号、重跑逐位用 tz-off-qkc（都是 C 口径之前、关 base2，C 口径上没重判）；抓数不改数值用 base2 开那一代的 mz-dump30 对 t1zg-b（C 口径上没做）；L3 整网梯度取 C 口径训练步实际用的第 1 步梯度（s1f-c 的第 1 步全量抓数反推）；路由一致率第 1 步用 C 口径之前、base2 关的 tw-ra1z，第 8、30、100 步仍是 base2 开的一代（都没在 C 口径上重判）；优化器一步只比各侧优化器作用在自己梯度上的算术，用 tz-off-rep 的第 1 步全量抓数在 CPU 上离线重算（C 口径之前，C 口径上没重判）
alignments:

    mini_why: '过（C 口径，2026-11-11 起）：主 loss 1000 步带符号均值 TPU +3.53e-6、噪声上限 4.65e-6（0.76 倍），最差是平均绝对相对误差 0.98 倍；前 300 步 0.87 倍。C 口径 6 份（tc-b … tc-d、tc-f 只改执行方式，tc-e 改了重算策略）里 1 份（tc-b，改 scoped VMEM）主 loss 全程、后段 1.14 倍待定（它的 MTP 全程、后段也是 1.06、1.07 倍待定）。C 口径之前的上一代（tz-off-rep）1.55 倍待定；后段主因是 iHC 流梯度的舍入写法，TPU、GPU 两头验证，但只开 M36 + M58 那一格也只是均值降到 +1.9e-6（p 0.016），5 份里 2 份仍超尾部阈值；C 口径 6 份第 551–1000 步对 GPU 16 份均值平均还高 +6.9e-6，6 份里 5 份尾部在，和只开 M36 的对照分不开（p 0.32，mini-factorial-tpu-6.json），C 口径的后段没修掉：M52 开着时补 M58 全套或任一半都测不出作用（对只开 M52 p 0.14 / 0.14 / 0.54，mini-factorial-c-parts-vs-m52.json），机制待查（[根源一览第 30 行](../ROOT-CAUSES.md#r30)）'
    say: 主 loss（全程）
    mini_say: '1000 步主 loss 逐步相对差的带符号平均：TPU +3.53e-6，GPU 16 份的波动上限 4.65e-6（0.76 倍）；平均绝对相对误差 8.75e-6 对 8.95e-6（0.98 倍）。C 口径之前（只开 M36，tz-off-rep）是 +7.21e-6（1.55 倍）。分段看（mini-factorial-tpu-6.json）：tc-a 第 51–100 步 +0.3e-6，只开 M36 的对照 4 份平均 +3.9e-6；第 551–1000 步 tc-a 还高 +8.2e-6，C 口径 6 份平均 +6.9e-6，对照（ti-o-a 与只改执行方式的三份 tz-off-*，不含 tz-off-rep）+9.4e-6，两者分不开（p 0.32；C 格含一份 remat_policy=full 的 tc-e）。只开 M36 + M58 那一格均值降到 +1.9e-6（p 0.016），5 份里 2 份仍超尾部阈值（第 751–1000 步均值超 3e-6）。C 口径的后段没修掉：M52 开着时补 M58 全套或任一半，对只开 M52 的 4 份都测不出作用（p 0.14 / 0.14 / 0.54，mini-factorial-c-parts-vs-m52.json），机制待查（[根源一览第 30 行](../ROOT-CAUSES.md#r30)）。C 口径 6 份都判时没有不过，但 tc-b（只改 scoped VMEM 64 MiB）主 loss 全程、后段 1.14 倍待定，它的 MTP 全程、后段 1.06、1.07 倍待定（t1zc-repeats-6.json）'

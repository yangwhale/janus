# 混元 4 · 06 真实宽度三层 L4 中间判档：TPU trw-e 第一段（被 spot 收走前跑到第 164 步，逐步记录从 Pod 里镜像出来）对 GPU rw1k-a 的前 164 步。
# 噪声 rw1k-a … rw1k-h 两两 28 对，同一窗口。检查项与 rw3-l4.yaml 相同，只是窗口截到第 164 步；1000 步跑完后以 rw3-l4.yaml 为准。
schema_version: 1
model: hunyuan4-rw3
stage: rw3-l4-first164
description: 真实宽度三层 L4，1000 步（TPU 被测，GPU rw1k-a 为基线，GPU 噪声 28 对）
runs:
  test: trw-e
  golden: [rw1k-a]
  noise:
    - [rw1k-a, rw1k-b]
    - [rw1k-a, rw1k-c]
    - [rw1k-a, rw1k-d]
    - [rw1k-a, rw1k-e]
    - [rw1k-a, rw1k-f]
    - [rw1k-a, rw1k-g]
    - [rw1k-a, rw1k-h]
    - [rw1k-b, rw1k-c]
    - [rw1k-b, rw1k-d]
    - [rw1k-b, rw1k-e]
    - [rw1k-b, rw1k-f]
    - [rw1k-b, rw1k-g]
    - [rw1k-b, rw1k-h]
    - [rw1k-c, rw1k-d]
    - [rw1k-c, rw1k-e]
    - [rw1k-c, rw1k-f]
    - [rw1k-c, rw1k-g]
    - [rw1k-c, rw1k-h]
    - [rw1k-d, rw1k-e]
    - [rw1k-d, rw1k-f]
    - [rw1k-d, rw1k-g]
    - [rw1k-d, rw1k-h]
    - [rw1k-e, rw1k-f]
    - [rw1k-e, rw1k-g]
    - [rw1k-e, rw1k-h]
    - [rw1k-f, rw1k-g]
    - [rw1k-f, rw1k-h]
    - [rw1k-g, rw1k-h]
  root: /data/janus-runs
checks:
  - {id: L4.loss, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "1:165"}, params: {baseline: rw1k-a}, threshold: calibrated}
  - {id: L4.loss.tail, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "101:165"}, params: {baseline: rw1k-a}, threshold: calibrated}
  - {id: L4.mtp_loss, type: loss_series, level: L4, select: {kind: metrics, field: mtp_loss_mt, window: "1:165"}, threshold: calibrated}
  - {id: L4.mtp_loss.tail, type: loss_series, level: L4, select: {kind: metrics, field: mtp_loss_mt, window: "101:165"}, threshold: calibrated}
  - {id: L4.indexer_loss, type: loss_series, level: L4, select: {kind: metrics, field: indexer_loss, window: "1:165"}, threshold: calibrated}
  - {id: L4.grad_norm, type: loss_series, level: L4, select: {kind: metrics, field: grad_norm, window: "1:165"}, threshold: calibrated}
  - {id: L4.param_norm, type: loss_series, level: L4, select: {kind: metrics, field: param_norm_fp64, test_field: param_norm_exact, window: "1:165"}, threshold: calibrated}
  - {id: L4.router.bias_mean, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_mean.", window: "1:165"}, threshold: calibrated}
  - {id: L4.router.bias_std, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_std.", window: "1:165"}, threshold: calibrated}

# 混元 4 · 06 真实宽度三层 base2 开 / 关短回放（250 步）：TPU b2r-off（只改 sa_use_base2_exp=false）与 b2r-on（现行）各对 GPU rw1k-a。
# 噪声 rw1k-a … rw1k-h 两两 28 对，同一窗口（全程第 1–250 步、后段第 101–250 步）。检查项与 rw3-l4.yaml 相同，只是窗口截到第 250 步。
# 被测用 `janus run … --test <运行名>` 换（b2r-off / b2r-on）。
schema_version: 1
model: hunyuan4-rw3
stage: rw3-l4-b2r250
description: 真实宽度三层 L4，base2 开 / 关短回放 250 步（TPU 被测，GPU rw1k-a 为基线，GPU 噪声 28 对）
runs:
  test: b2r-off
  golden: [rw1k-a]
  noise:
    - [rw1k-a, rw1k-b]
    - [rw1k-a, rw1k-c]
    - [rw1k-a, rw1k-d]
    - [rw1k-a, rw1k-e]
    - [rw1k-a, rw1k-f]
    - [rw1k-a, rw1k-g]
    - [rw1k-a, rw1k-h]
    - [rw1k-b, rw1k-c]
    - [rw1k-b, rw1k-d]
    - [rw1k-b, rw1k-e]
    - [rw1k-b, rw1k-f]
    - [rw1k-b, rw1k-g]
    - [rw1k-b, rw1k-h]
    - [rw1k-c, rw1k-d]
    - [rw1k-c, rw1k-e]
    - [rw1k-c, rw1k-f]
    - [rw1k-c, rw1k-g]
    - [rw1k-c, rw1k-h]
    - [rw1k-d, rw1k-e]
    - [rw1k-d, rw1k-f]
    - [rw1k-d, rw1k-g]
    - [rw1k-d, rw1k-h]
    - [rw1k-e, rw1k-f]
    - [rw1k-e, rw1k-g]
    - [rw1k-e, rw1k-h]
    - [rw1k-f, rw1k-g]
    - [rw1k-f, rw1k-h]
    - [rw1k-g, rw1k-h]
  root: /data/janus-runs
checks:
  - {id: L4.loss, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "1:251"}, params: {baseline: rw1k-a}, threshold: calibrated}
  - {id: L4.loss.tail, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "101:251"}, params: {baseline: rw1k-a}, threshold: calibrated}
  - {id: L4.mtp_loss, type: loss_series, level: L4, select: {kind: metrics, field: mtp_loss_mt, window: "1:251"}, threshold: calibrated}
  - {id: L4.mtp_loss.tail, type: loss_series, level: L4, select: {kind: metrics, field: mtp_loss_mt, window: "101:251"}, threshold: calibrated}
  - {id: L4.indexer_loss, type: loss_series, level: L4, select: {kind: metrics, field: indexer_loss, window: "1:251"}, threshold: calibrated}
  - {id: L4.grad_norm, type: loss_series, level: L4, select: {kind: metrics, field: grad_norm, window: "1:251"}, threshold: calibrated}
  - {id: L4.param_norm, type: loss_series, level: L4, select: {kind: metrics, field: param_norm_fp64, test_field: param_norm_exact, window: "1:251"}, threshold: calibrated}
  - {id: L4.router.bias_mean, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_mean.", window: "1:251"}, threshold: calibrated}
  - {id: L4.router.bias_std, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_std.", window: "1:251"}, threshold: calibrated}

    - name: 注意力整块
      what: MLA 投影与 norm、RoPE、索引器自选 top-k、稀疏注意力与 sink、输出门、o_proj
      objects: '`self_attn`（自选 top-k）'
      src:
        real: hy4-a-l1-op-tpu-fix:L1.ops.op.attn_block

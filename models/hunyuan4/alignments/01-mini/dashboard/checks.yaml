unlisted_reasons:
  t1-step1-grad-vs-ref: 第 1 步梯度对 TPU 一侧产出的参照，与被测同源、不作定责；正式比较是对应的 `*-step1-grad-vs-fp64`（CPU FP64）
  t1t-step1-grad-vs-ref: 第 1 步梯度对 TPU 一侧产出的参照，与被测同源、不作定责；正式比较是对应的 `*-step1-grad-vs-fp64`（CPU FP64）
  t1v-step1-grad-vs-ref: 第 1 步梯度对 TPU 一侧产出的参照，与被测同源、不作定责；正式比较是对应的 `*-step1-grad-vs-fp64`（CPU FP64）
  t1z-step1-grad-vs-ref: 第 1 步梯度对 TPU 一侧产出的参照，与被测同源、不作定责；正式比较是对应的 `*-step1-grad-vs-fp64`（CPU FP64）
  t1t-step1-ihc-experiments: iHC 梯度三种 TPU 写法对 TPU 一侧产出的参照的比较，不作定责；M28 对 CPU FP64 的效果见 t1t / t1v-step1-grad-vs-fp64
  t1-l4-vs-8gpu: 诊断：四代 TPU 各对 8 份 GPU（g3-a…h）的 r 与 GPU 28 对留一 r；L4 判定只对单一 golden g3-a，多份 GPU 只定噪声
  t1-l4-vs-8gpu-rules: 诊断：同 t1-l4-vs-8gpu，由 l4_vs_all_goldens.py 从正式目录文件重跑；文件里的 rules（C1–C3）是未采用的候选，不作判定
  t1-route-agree-step1: 路由一致率第 1 步只有 GPU 尺子的一版（TPU 抓数到位前），被 t1-route-agree-s1 取代
  t1-route-agree-step1-tpu: 被 t1-route-agree-s1 取代：它用的 tw-ra1 抓数文件第 1 行有一段 DSA top-k 在取回时被零填充；重抓的 tw-ra1b 与作业内的 sha256 逐位一致
  t1-switch-isolation-tpu: 逐个开关单独量（以 T1 现行全开为底，每次只关一个：M13、M26、M27、M23、M9、M8、M10、M12、M28、M36、M25）：前向单算子对 FP64 与 GPU、第 1 步参数梯度 TPU 对 GPU、开关前后是否逐位相同、M13 / M27 / M8 换训练后权重重放、M26 重选计数；诊断
  t1-embed-scatter-precision-tpu: 词嵌入反向 scatter-add 的累加精度核实（tembd-scatter）：excess precision 开 / 关下 TPU 结果逐位等于哪种累加方式（FP32 累加舍一次 / BF16 逐次舍），与对 FP64 的 rel_L2；诊断
  t1-step1-embed-grad-fp32: 第 1 步整网梯度 excess precision 开 / 关 × embedding_grad_fp32 开 / 关四档各对 CPU FP64（ihcopt-a / d、tembd-a / d）；诊断
  t1-step1-rmsnorm-gpu-order-tpu: rmsnorm_scale_grad_gpu_order（M48）开 / 关第 1 步整网梯度各对 CPU FP64（tdg-m2 / tdg-m02）与前向核对；记录 TPU 上打开后前向与非 norm 梯度也变了，整网结果作废待查；诊断
  t1-hlo-probe-tpu: M28 / M9 机制核实（tw-hlo-a / b）：TPU 结果逐位等于哪种加法顺序 / 舍入次数，与对 FP64 的 rel_L2；诊断
  t1-w-combo-tpu: '#4：GPU g2w-a 第 k 步状态进 TPU（不灌路由）的 M40 / M41 四种组合与 M42 / M42b 单步梯度对 GPU；组合之间看不出区别，推断被路由翻转盖住；灌选择的版本等 g2w-b；诊断'
  t1-forced-replay-tpu: GPU 第 1 步的路由下标（M45）与 DSA 索引器 top-k（M46）灌进 TPU 后第 1 步梯度对 GPU g8-chg-a（tw-fr0 / fr1 / fri1 / fi1、tw-g42b）：灌路由后逐张量 rel_L2 中位数 4.25e-3 → 2.23e-3；只报 TPU 对 GPU，R 等 CPU FP64 参照；诊断
  t1-sink-probe-m42b-tpu: M42b（splash_dsinks_gpu_order）的 TPU 单层探针（tw-sinkprobe2）：sink 梯度对按 GPU 写法算的 dsink 逐元素比、对 FP64 的 R（5 层都在 1.000–1.001）；诊断
  t1-sink-probe-tpu: tokamax splash 精度探针（tw-sinkprobe）：sink 梯度 tokamax 原样 / splash_dsinks_fp32（M42）对 FP64 与按 GPU 写法算的 dsink，前向 logsumexp / o 在 sa_use_base2_exp 开 / 关下对 FP64；诊断

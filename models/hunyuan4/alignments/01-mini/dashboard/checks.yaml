      why: 诊断：GPU 的 BF16 权重与 bf16(主权重) 只差 1 个 BF16 ulp，下一次优化器更新就被主权重覆盖；30 步 lm_loss 的 TPU 对 GPU 在 GPU 两份的散布内，所以不加开关。
    - name: T0：hy4-tiny 逐层
      what: hy4-tiny（FP32、CPU）逐层前向 / 反向与第 1 步更新，两侧各对 FP64
      objects: 7 层 + MTP
      src:
        mini: 'todo: 待做'
      why: T0 还没做。

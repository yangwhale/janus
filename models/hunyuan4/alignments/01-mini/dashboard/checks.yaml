    - name: 低阈值 QK-Clip：被裁的头
      info: true
      what: 30 步逐步逐头被裁的集合，TPU 对 GPU-a，对照 GPU-b 对 GPU-a；TPU 是现行配置（base2 关）的 `tz-off-qk01`，GPU `g6-qk-a` / `b`
      objects: 30 步 × 64 头
      agg: 集合差的合计，只报不判
      src:
        mini: t1zo-qkclip-maxlogit:L1.qkclip.clipped_heads_30
      why: 诊断：现行配置 30 步的集合差合计 TPU 对 a 21、b 对 a 12（1.75 倍）；GPU 只有一对，判不了 21 在不在 GPU 的散布内。base2 开的上一代 `mz-qk-a` 是 17（`t1-qkclip-maxlogit`），更早打开 M31、M33 之前的 `tw-qk-a` 是 15（第 1 步三方都裁同样的 47 个头，`t1-qk-clip-tpu`）。同表逐头最大 logit 第 4 层不过，方向一致。
    - name: 低阈值 QK-Clip：GPU 另裁 BF16 权重
      info: true
      what: GPU 把 BF16 模型权重单独按 bf16(W_bf16 × 因子) 裁，不是 bf16(裁剪后主权重)；MaxText 只有 FP32 主权重（已知语义差）
      objects: 第 1–5 步 7 层 + MTP 的 q_b / kv_b
      agg: 两种 BF16 权重的差与 30 步 lm_loss 的散布，只报不判
      src:

- id: L3
  title: L3 · 整网第 1 步
  purpose: 第 1 步的梯度与状态在 GPU 第 1 步参照的噪声内，超出的对参照定责（参照是 CPU FP64 整网重算，与 TPU 不同源）
  lead:
  - 目的：同一份权重、同一个 batch，整网跑第 1 步，比梯度与优化器状态。
  - ''
  - L3 共 {rows} 项检查，检查条数 {checks}，张量级比较 {tensors} 次。
  - ''
  - '- TPU 的第 1 步来自训练程序的诊断模式（`train_hy4.py --diag-step1`：回放 GPU 第 1 步的 batch，用训练里同一个梯度累积函数，不更新）。'
  - '- TPU 用现行配置训练步实际用的第 1 步梯度（由 `tz-off-rep` 第 1 步全量抓数的动量反推：反推的舍入量级：Adam 参数上两条反推路径（由 m、由 v）逐元素互比，最大 1.68 个 FP32 单位舍入（约 1.0e-7），比 TPU 离 FP64 的距离（中位数 6.4e-3）小四个数量级以上；落盘与取回核对见 [`t1zo-step1-train-grad-file-check.json`](results/t1zo-step1-train-grad-file-check.json)，728 个张量的 sha256 全对上；base2 开的上一代 `mz-opt2` 与诊断程序 `mz-diag1` 只作旁证）对 GPU 第 1 步全量抓数参照 `g2s-a … g2s-f` 6 份（HF 名字与布局，台账 G15；注意力 q·k 在 FP32 里算，台账 G17；`g2s-d … f` 是 2026-11-11 用同一代码包、镜像与参数补跑的，`meta.json` 除运行名与启动时的 TF32 探针外逐字段相同，新旧两批之间没有批次差，[`g2s6-meta-vs-g2sa.json`](gpu-noise/results/g2s6-meta-vs-g2sa.json)）。'
  - '- 噪声只用这 6 份两两 15 对（协议第 5 节；2026-11-11 前是 `g2s-a/b/c` 三份 3 对，那时的判定见 [`t1zo-step1-train-grad-vs-fp64.json`](results/t1zo-step1-train-grad-vs-fp64.json) 与 PROTOCOL 变更记录同日「L3 尺子 6 份」一行）。逐张量 r = TPU 对最近一份 GPU 的 rel_L2 ÷ GPU 6 份两两的最大 rel_L2。'
  - '- **分辨率下限**（PROTOCOL 第 5 节）：GPU 第 1 步噪声 N = 0、且两边对参照的 rel_L2 都小于 BF16 单位舍入 u = 2^-8 的张量，记「低于分辨率（按下限过）」，不再用 R 判。有 5 个这样的张量（第 0、1 层索引器的 `k_norm`、`weights_proj` 等）。'
  - '- 超出噪声的张量对 CPU FP64 参照定责：GPU golden 同一套 Megatron-Core 代码与 loss 语义在 CPU 上全程 FP64 重算第 1 步（`frameworks/megatron/step1_ref.py`；逐算子核过没有 FP64 以外的浮点输出；同一代码的 CPU FP32 版离它的 rel_L2 中位数 1.34e-4），离散选择（DSA top-k、MoE 路由）由 FP64 自己选。R = rel_L2(TPU, FP64) ÷ rel_L2(GPU, FP64)（GPU 取 6 份的中位数）≤ 1.2 算已定责。有超 2N 而未定责的张量判不过，只有 1–2N 未定责的判待定。'
  tables:
  - rows:
    - name: 全部参数梯度对 GPU 第 1 步噪声，超出的对参照定责
      what: 逐张量算 r 与 R（见本级开头），参照是 CPU FP64
      objects: 205 个张量（HF 名字；路由专家只有 rank 0 的 0–3 号）
      agg: 逐张量算 r 与 R，数「超出 N 且 R > 1.2」的张量：有超 2N 的就不过（待定责），只有 1–2N 的待定
      src:
        mini: t1zo-step1-train-grad-vs-fp64-n6:L3.step1.grads.vs_gpu
      why: 以现行比较 tz-off-rep 为准、GPU 参照 6 份 15 对：169 个超出 N、35 个超出 2N；超出 N 而 R > 1.2 的 2 个：第 3 层注意力前 `hc_scale` 计入未定责（1.05 N；GPU 1.19e-3，TPU 6.40e-3，R 5.36；只在 1–2N，所以待定），MTP `enorm`（1.44 N，R 1.24、两边都小于 u）另列；两个都按 D11 豁免规则单列（豁免规则与沿用待复核；enorm 的接受理由见 D13）。另有 11 个 iHC 张量 R > 1.2 但在噪声内（最大第 3 层 FFN 前 `hc_scale` R 5.83、0.85 N），按规则不定责。GPU 3 份 3 对时（2026-11-11 前）是 177 个超出 N、46 个超出 2N、5 个 iHC 未定责（超 2N 的第 6 层 FFN 前 `hc_base` 5.09 N），判不过；补到 6 份后这 5 个里 4 个落进噪声（第 6 层 FFN 前 `hc_base` 0.21 N、`hc_fn` 0.59 N，第 0 层注意力前 `hc_base` 0.60 N，第 2 层注意力前 `hc_scale` 0.74 N），关 base2 后新出现的 3 个都在其中。剩下的第 3 层 `hc_scale` 与 base2 开那一代（`mz-opt2`）单列的 6 个 iHC 张量是同一批（对齐细节 D11）。那次接受理由里的「落在病态小参数上」后来量了（GPU `g2s-a` 第 1 步一条序列的条件数 κ）：κ 与 R 只弱相关（名次相关 0.25）（`t1-ihc-param-grad-conditioning.json`，对齐细节 D11）。
    - name: 按算子分组的参数梯度
      what: 同上一行，按算子分组各判一次（分组见 `build.py` 的 `STEP1_OPS`），供「模型的每个算子由哪条检查覆盖」的 L3 列用
      objects: 205 个张量分成 27 组
      agg: 每组同上一行的规则；格子写最差的一组，并排写这一组里 R 最大的张量两边对参照的 rel_L2
      src:
        mini: t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.*
      why: iHC（hc_pre）一组待定（第 3 层注意力前 `hc_scale` 1.05 N 计入未定责；GPU 3 份时这一组不过）；其余过（索引器 k_norm 一组按分辨率下限过；enorm 另列）。hc_scale 与 enorm 都按 D11 豁免规则单列（豁免规则与沿用待复核）。
    - name: iHC post 门控梯度的条件数
      info: true
      what: 每个 token 的 dL/dpost_k = Σ_d h[t,d]·g[t,k,d]（h 是本层 FFN 分支输出，g 是本层输出流的梯度），条件数 κ_k = Σ_t ｜项｜ ÷ ｜Σ_t 项｜；GPU `g2s-a` 第 1 步 rank 0 第 0 个 microbatch 的一条 4096 token 序列
      objects: 第 1–3 层 FFN 一侧，各 4 路
      agg: 每层 4 路的 κ 范围，只报不判
      src:
        mini: t1-ihc-post-grad-conditioning:L3.step1.ihc.post_conditioning
      why: 诊断。κ 约 25–1400：每个 token 的项里 1e-4 量级的系统差，加总以后放大成 1e-2 量级的相对差（层号按 HF 检查点从 0 数）。第 1 层 κ 710–1359、第 3 层约 95，放大倍数够大；第 2 层只有约 25。
    - name: 路由一致率（对 CPU FP64）
      what: TPU 自选的 MoE 路由（每个 token 选中的专家集合）与 DSA top-k（每个 query 选中的位置集合）逐层对 CPU FP64 自选比；每层 R = TPU 的翻转率（DSA 为不重合率）÷ GPU 三份对 FP64 的最大值
      objects: 第 1、8、30、100 步；路由第 1–6 层与 MTP 层，DSA 第 0、1、5 层与 MTP 层；第 8、30、100 步三方从 GPU 同一份重建状态起步；TPU 只取现行配置的抓数（第 1 步 base2 关的 `tw-ra1z`；base2 开的 `tw-ra1b` 不计，`build.py` 的 `ROUTE_AGREE_SKIP`）；第 8、30、100 步只有 base2 开那一代的抓数（`tw-ra8`、`tw-ra30`、`tw-ra100b`），关 base2 后没有重测。用到的抓数文件 sha256 都等于作业内记下的；最早的 `tw-ra1`、`tw-ra100` 两份拿到的文件里各有一段连续的零（约 2.1 MB、4.1 MB，结尾落在 256 MiB 的整数倍上），与作业内的 sha256 对不上，已由同设置重抓的 `tw-ra1b`、`tw-ra100b` 替代：两份重抓的文件 sha256 正好等于原来作业内记下的值，除那一段外逐字节相同。格子写四步里 R 最大的一格，现为第 8 步（base2 开的 `tw-ra8`，DSA，GPU 6.68e-4、TPU 6.67e-4，R 0.999），链接仍指第 1 步的文件；现行配置第 1 步（`tw-ra1z`）最差是 DSA 第 0 层，GPU 6.74e-4、TPU 6.69e-4，R 0.993；第 30、100 步最差 0.991、0.998。每步的读数在总览细节
      agg: 每步取路由与 DSA 各层里最差的 R；≤ 1.2 过、≤ 2 待定、> 2 不过（PROTOCOL 第 5 节，2026-11-09 起）
      src:
        mini: t1-route-agree:L3.route_agree.*
    - name: Muon 动量、Adam 状态、更新后参数
      what: 第 1 步优化器一步本身：各侧对「FP64 优化器作用在自己的梯度上」比（TPU 梯度由自己的动量反推，GPU 用同一次运行抓的梯度）
      objects: 更新后参数 205 个张量（98 个低于分辨率下限）、Adam 二阶动量 99 个（都低于分辨率下限，格子里的 R 是两次舍入之比、按下限过）；一阶动量与 Muon 动量按定义是 (1−β)·梯度，TPU 梯度又由一阶动量反推，比较是循环的，只报
      src:
        mini:
        - t1zo-l3-optim-step1:L3.step1.optim_arith.delta
        - t1zo-l3-optim-step1:L3.step1.optim_arith.adam_v
    - name: 第 1 步更新端到端对 FP64
      info: true
      what: 更新后参数、Adam 一阶 / 二阶动量、Muon 动量各对 CPU FP64 端到端比（含梯度的差）
      objects: 同上一行
      src:
        mini:
        - t1zo-l3-optim-step1:L3.step1.optim.*
        - t1zo-l3-optim-step1:L3.step1.optim_arith.adam_m
      why: 只报：未定责来自梯度（以现行比较 tz-off-rep 为准）。更新后参数 17 个（10 个 iHC 张量与第 1 层 `input_layernorm`、第 2 / 4 层 `q_a_layernorm`、索引器 `wk` / `wq_b`、`model.norm` 等），Adam 一阶动量 6 个、二阶动量 11 个（含 sink、enorm）；Adam 第 1 步约为 −lr·sign(g)，近零梯度元素翻符号就是整格更新。最差的是第 3 层注意力前 `hc_base`（8 个元素）：参照的更新量范数 3.0e-5 ≈ √8 × lr，TPU 对参照 rel_L2 0.703 ≈ 2 ÷ √8，按数值反推是 1 个元素的更新方向反了（文件没有存逐元素数）；它的一阶动量 TPU 在 GPU 三份的波动内（GPU 自己离参照也有 0.10）。Muon 动量 GPU 抓数里没有，只报 TPU 对 FP64（rel_L2 中位数 6.1e-3）。base2 开那一代（`mz-opt2`，`t1-l3-optim-step1`）是 17 / 7 / 13 个。
    columns:
    - mini
- id: L4
  title: L4 · 多步训练
  purpose: 300 步 / 1000 步的逐步曲线在 GPU 重跑的噪声内
  lead:
  - 目的：训练 300 步或 1000 步，看 TPU 被测对 GPU 基线的差是否落在 GPU 自己重跑的散布里。
  - ''
  - L4 共 {rows} 项检查，检查条数 {checks}（{cols}）。
  - '- 现行比较（mini 列，目录 `t1zo-l4.yaml`，2026-11-11 起）：TPU 被测 `tz-off-rep`（T1 yml 的全部开关，含 M50，base2 关）对 GPU 基线 `g3-a`，噪声 `g3-a … g3-p` 16 份两两 120 对；1000 步过 7、待定 2（主 loss 两个窗口）。上一代 `t1zg-a`（base2 开）与诊断代见[历代比较](../../dashboard/history.md)。'
  - '- 同一运行的前 300 步（w300 列，目录 `t1zc300-l4.yaml`）对 GPU `g2-a`，噪声 `g2-a … g2-h` 两两 28 对：过 8、待定 1（grad_norm）。QK-Clip 一行的 w300 仍是 C 口径之前的 `t1zo300-l4-qkclip`。'
  - ''
  - '- 噪声上限 N 只用 GPU，每个判定量取各对的最大值（协议第 3 节）。TPU 只改执行参数的扰动运行只作诊断。'
  - '- 每条序列算三个判定量：带符号均值、MARE、最大单步；三个都对 N 判，取最差。格子写最差那个判定量的 TPU 实测（括号里是名字、实测 ÷ N 的倍数，N 与判法栏不同时另写 N）。首步差只报。'
  - '- 学习率不在这一级：它是登记的常数，归 L0 设置核对。'
  tables:
  - title: 现行比较
    rows:
    - name: loss
      what: 全程逐步主 loss 的相对差
      objects: '`lm_loss`，第 1–1000 步（w300 列：第 1–300 步）'
      src:
        mini: t1zc-l4:L4.loss
        w300: t1zc300-l4:L4.loss
      why: 待定，与 base2 无关：1000 步带符号均值 N 4.65e-6（16 份 120 对），TPU +7.21e-6，r 1.55；前 300 步 N 3.01e-6，TPU 3.31e-6，r 1.10。开、关 base2 各 4 份 1000 步两组交叠，8 份 TPU 都比 GPU 16 份均值高约 +4.3e-6，原因待查（对齐细节 D30、根源一览「还没查明」）。
    - name: loss 后段
      what: 第 101 步起
      objects: '`lm_loss`，第 101–1000 步（w300 列：第 101–300 步）'
      src:
        mini: t1zc-l4:L4.loss.tail
        w300: t1zc300-l4:L4.loss.tail
      why: 同上一行：第 101 步起 N 5.02e-6，TPU +7.62e-6，r 1.52；前 300 步的第 101 步起过（0.78）。
    - name: MTP loss
      what: 逐步 MTP loss（两边都读 MaxText 口径 `mtp_loss_mt`），全程与后段
      objects: '`mtp_loss_mt`，全程与第 101 步起。1000 步 MARE 贴线：TPU 3.722e-5，N 3.725e-5（0.9993 倍）；N 从 8 份换 16 份没变（`gpu-noise/results/g3x16-noise-vs-8.json` 的 MARE 比 1.0），上限由某一对决定，换一份 GPU 就可能翻成待定'
      src:
        mini: t1zc-l4:L4.mtp_loss*
        w300: t1zc300-l4:L4.mtp_loss*
    - name: 索引器 KD loss
      what: 逐步索引器 KD loss（各产出层平均 × 0.1）
      objects: '`indexer_loss`，全程'
      src:
        mini: t1zc-l4:L4.indexer_loss
        w300: t1zc300-l4:L4.indexer_loss
      why: 过（1000 步 MARE：N 3.90e-4，TPU 2.98e-4，r 0.77）：M50 改记广义 KL 后由待定变过（对齐细节 D1、根源一览第 25 行）。
    - name: grad_norm
      what: 逐步裁剪前全局梯度范数；分母用参照（2026-11-10 起，原为两边均值）
      objects: '`grad_norm`，全程'
      src:
        mini: t1zc-l4:L4.grad_norm
        w300: t1zc300-l4:L4.grad_norm
      why: 1000 步过（MARE r 0.81）；前 300 步 MARE N 3.85e-4，TPU 4.74e-4，r 1.23，待定。base2 开的上一代同一项已定责、已接受（同一状态单步 6 次里 5 次 TPU 更近 FP64），那套证据没在关 base2 的状态上重做（对齐细节 D2）。
    - name: param_norm
      what: 逐步更新后的参数范数，两边读精确值：GPU `param_norm_fp64`，TPU `param_norm_exact`（每 128 个元素一段 FP32 求平方和、FP64 合成）
      objects: 全程
      src:
        mini: t1zc-l4:L4.param_norm
        w300: t1zc300-l4:L4.param_norm
      why: TPU 原来记的 FP32 全局求和单步误差 −4.4e-7 至 +2.9e-7，与 N 同量级，所以两边比精确值（对齐细节 D12）。
    - name: 路由偏置曲线
      what: 逐步每层路由偏置的均值、标准差
      objects: 第 1–6 层与 MTP 层。均值、标准差各自对 N 判：1000 步标准差 MARE 的 N 5.78e-3；均值在 0 附近，逐步相对差被除零放大，N 很宽（1000 步 MARE 1.82、单步最大 705；前 300 步 1.52、43.6），这条对偏置均值几乎没有分辨力（改用绝对差或按标准差归一：待定，待拍板）；w300 格的 40.1 是偏置均值的单步最大相对差
      src:
        mini: t1zc-l4:L4.router.*
        w300: t1zc300-l4:L4.router.*
      why: 两个窗口都过：1000 步均值 r 0.20、标准差 0.77；前 300 步 0.92、0.67。base2 开的上一代标准差 1000 步 1.14 倍，已定责、已接受（对齐细节 D23）。
    - name: QK-Clip
      what: 每步全局最大注意力 logit（各层含 MTP 各头最大 logit 的最大值，不含 sink）的相对差；被裁头数见健康信号一行
      objects: TPU `tz-off-qkq`（现行 yml、base2 关，1000 步；不是另跑的运行：`analysis/derive_max_logit.py` 给 `tz-off-qkc` 的 metrics 每行加一列全局最大 logit；`tz-off-qkc` 与主 L4 的被测 `tz-off-rep` 1000 步 47 个逐步量逐位相同，见 `t1zo-determinism`，所以是同一条轨迹）对 GPU `g3-a`，噪声 `g3` 16 份两两 120 对；w300 列对 `g2` 一组
      src:
        mini: t1zo-l4-qkclip:L4.qkclip.max_logit
        w300: t1zo300-l4-qkclip:L4.qkclip.max_logit
      why: 待定：1000 步 MARE N 1.86e-3、TPU 2.02e-3，r 1.09；前 300 步单步最大 N 4.34e-2、TPU 4.54e-2，r 1.05（base2 开的上一代：1000 步 1.02、前 300 步带符号均值 1.77，已定责、已接受，对齐细节 D29；1.02 是 8 份 28 对尺子的读数，按现行 16 份尺子推算约 1.00（推断：上一代 MARE 1.85e-3 ÷ 现行 N 1.86e-3），所以 1.02 → 1.09 不全是关 base2 变差，一部分是换了尺子）。关 base2 后同一状态单步的定责证据没有重做
    - name: 健康信号
      what: NaN / Inf、跳步、梯度裁剪是否触发、QK-Clip 被裁头数、MoE 是否丢 token、loss 尖峰（协议第 4 节）
      objects: TPU `tz-off-qkc`（现行 yml、base2 关）对 GPU `g3-a`，1000 步

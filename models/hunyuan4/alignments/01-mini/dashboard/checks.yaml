  - title: mini 的其他 L1 检查（KD 输入、优化器回放、逐元素函数、QK-Clip）
    rows:
    - name: 索引器 KD 的输入
      what: 第 0 层第 0 行（GPU rank 0 micro 0 = TPU 第 0 行）的教师 q、教师 k、索引器分数，对 CPU FP64（`step1_ref.py --forward-only`，`t1-l1-kd-qkclip-vs-fp64.json`）；TPU 是 t1z 设置的 `t1zdiag2`，GPU 是 `g1p-kdd`
      objects: 教师 q、教师 k、索引器分数（只比因果部分）
      src:
        mini: t1-layer0-kd-attribution:L1.indexer_kd.inputs
    - name: 优化器连续 8 步回放（现行：M30（T1 开，M31）、M34）
      what: GPU `g2o-a` 第 1–8 步的梯度与主权重喂 MaxText 优化器，对 FP64 参照（Adam 一支的除法、sqrt、1 − β^t 用精确写法，台账 M34）
      objects: rank 0 的 205 个张量 × 8 步
      agg: 逐步逐张量算 R，取最差
      src:
        mini: t1-optim-replay-adam-acc-r2-tpu:L1.optim_adam_r2.tpu_adam_acc
      why: 最差是 Muon 第 6 步 `weights_proj`：GPU 1.36e-2，TPU 1.41e-2，R 1.03（对齐细节 D17）。
    - name: 逐元素函数：XLA 默认实现（FP32）
      what: exp、log、sigmoid、silu、rsqrt 对 FP64 正确舍入的 ulp；合成输入（均匀、对数均匀、[1, 4) 全部 FP32）与真实输入（GPU `g2s-a` 的路由 logits、稠密 MLP gate、RMSNorm 均方，TPU 第 0 层 KD 的分数与教师目标）
      objects: 每个函数 3–5 个用例
      src:
        mini:
        - tpu-elementwise-ulp:L1.elem.exp.fp32
        - tpu-elementwise-ulp:L1.elem.log.fp32
        - tpu-elementwise-ulp:L1.elem.sigmoid.fp32
        - tpu-elementwise-ulp:L1.elem.silu.fp32
        - tpu-elementwise-ulp:L1.elem.rsqrt.fp32
      why: exp 105、log 62、sigmoid 83、silu 86 ulp，超过 CUDA 文档门槛（exp ≤ 2、log ≤ 1、sigmoid / silu ≤ 4）（对齐细节 D14）。
      info: true
      agg: 逐函数取最差用例；只报（生产不开开关时的精度，判定看现行开关写法一行）
    - name: 逐元素 sqrt、除法：XLA 默认实现（FP32）
      what: FP32 sqrt（对数均匀 1e-30–1e30）与除法（随机、Adam 形状）对 FP64 正确舍入的 ulp；另报 1 − β^t（t = 1..1000）
      objects: 3 个用例
      src:
        mini:
        - tpu-elementwise-ulp:L1.elem.sqrt.fp32
        - tpu-elementwise-ulp:L1.elem.div.fp32
      why: 门槛都是 1 ulp（CUDA 默认 sqrtf、x / y 正确舍入）；TPU v5p 实测 sqrt 3、除法 2 ulp，1 − β^t 最多 108 ulp（只报）。M34 换成修正写法后见下一行（对齐细节 D17）。
      info: true
      agg: 逐用例取最差；只报
    - name: 逐元素函数：现行开关写法（FP32）
      what: '`transcendental_accuracy_highest` 的 exp / log / sigmoid / silu（`maxtext.utils.accurate_math`，M32 + M37）与 `muon_adam_accurate` 的 sqrt、除法（M34），加 rsqrt（无开关）；同一批输入'
      objects: 每个函数 3–5 个用例
      agg: 逐函数取最差用例，按函数取 CUDA 文档门槛：exp ≤ 2、log ≤ 1、sigmoid / silu ≤ 4、sqrt / 除法 ≤ 1、rsqrt ≤ 2 ulp
      src:
        mini:
        - tpu-elementwise-ulp:L1.elem.exp.fp32_mt
        - tpu-elementwise-ulp:L1.elem.log.fp32_mt
        - tpu-elementwise-ulp:L1.elem.sigmoid.fp32_mt
        - tpu-elementwise-ulp:L1.elem.silu.fp32_mt
        - tpu-elementwise-ulp:L1.elem.sqrt.fp32_mt
        - tpu-elementwise-ulp:L1.elem.div.fp32_mt
        - tpu-elementwise-ulp:L1.elem.rsqrt.fp32
      why: log 3 ulp 超过 CUDA logf 的 1 ulp 门槛，GPU B200 实测 1 ulp；MaxText 开关 M51（精确 log，默认关，对齐配置未开）同一批输入 ≤ 1 ulp（下一行，对齐细节 D14）；其余过：exp 1、sigmoid 3、silu 4、sqrt 1、除法 1、rsqrt 2 ulp（1 − β^t 2，只报）。
    - name: 逐元素 log：GPU 实测与 TPU 精确写法
      info: true
      what: FP32 log 对 FP64 正确舍入的 ulp：GPU B200 `torch.log` 实测；TPU 精确写法（e_logf.c 算法的 FP32 移植加精确除法）的独立实现与 MaxText 开关 `transcendental_log_freebsd`（M51，默认关，对齐配置未开）
      objects: 4 批输入：[0.5, 4) 全部 FP32、两段对数均匀、KD 真实输入
      agg: 逐批取最大 ulp，取最差的一批；只报
      src:
        mini:
        - t1-log-ulp:L1.elem.log.gpu_b200
        - t1-log-ulp:L1.elem.log.tpu_fdlibm
        - t1-log-ulp:L1.elem.log.tpu_maxtext_m51
    - name: 逐元素 relu、clamp、加乘与类型转换
      what: relu、clamp（±10，路由专家 SwiGLU 的截断）、FP32 加乘、FP32 → BF16，必须逐位等于 numpy（次正规数另计）
      objects: 合成与真实输入
      src:
        mini:
        - tpu-elementwise-ulp:L1.elem.relu.fp32
        - tpu-elementwise-ulp:L1.elem.clamp.fp32
        - tpu-elementwise-ulp:L1.elem.basic
    - name: log-sum-exp（KD 的 log_softmax）
      info: true
      what: logsumexp 与 log_softmax 反推的 LSE 对 FP64 的 ulp；真实 KD 输入（4096 行）与三种合成行；另拆 exp、FP32 求和、log 三步
      objects: 4 组行
      agg: 逐组算，只报不判
      src:
        mini: tpu-elementwise-ulp:L1.elem.lse.fp32
      why: 诊断：单独编译时在同一批 KD 输入上复现了 LSE 平均偏低约 0.95 格；偏差来自 TPU 的 FP32 exp（输入近 0 时平均偏低约 2.5 格）与 log（约 0.6 格），求和不贡献。
    - name: FP32 超越函数精度开关（KD 第 0 行）
      info: true
      what: MaxText `transcendental_accuracy_highest`（台账 M32）关 / 开：第 0 层索引器 KD 第 0 行，TPU 图内对同一批输入的 FP64 重算
      objects: 1 行，两组
      agg: 两组各一个相对差，只报不判
      src:
        mini: t1-step1-transcendental-accuracy:L1.transcendental.kd_row0
      why: 诊断：开关打开后 KD 第 0 行的偏低与 LSE 的 0.95 格偏差都消失（数字见格子），第 0 层 KD 的定责成立（对齐细节 D14）。
    - name: 低阈值 QK-Clip：裁剪的算法
      what: τ 0.1、30 步（GPU `g6-qk-a/b`，TPU `tw-qk-a`，打开 M31、M33 之前的设置）：TPU 裁剪后的 q / kv 上投影主权重 ≟ GPU 裁剪前的主权重 × TPU 自己记下的 η（Megatron-Core 的行规则，α 0.5）
      objects: 第 1 步 7 层 + MTP 的 q_b / kv_b
      src:
        mini: t1-qk-clip-tpu:L1.qkclip.formula
    - name: 低阈值 QK-Clip：逐头最大 logit
      what: 第 1 步逐层逐头的最大 logit（η 的分母）对 CPU FP64；TPU 是现行配置（base2 关）的 `tz-off-qk01`（base2 开的上一代 `mz-qk-a` 见 `t1-qkclip-maxlogit`），GPU 取 `g6-qk-a` / `b` 的中位数
      objects: 8 层 × 8 头
      src:
        mini: t1zo-qkclip-maxlogit:L1.qkclip.max_logit
      why: 未定责：关 base2 后第 4 层 R 1.55（最差一个头相对差 −1.19e-2，约 3 个 BF16 舍入单位）；base2 开时同一量过（第 4 层 0.94，最差层 1.05）。还没有查
    - name: 低阈值 QK-Clip：被裁的头
      info: true
      what: 30 步逐步逐头被裁的集合，TPU 对 GPU-a，对照 GPU-b 对 GPU-a
      objects: 30 步 × 64 头
      agg: 集合差的合计，只报不判
      src:
        mini: t1-qk-clip-tpu:L1.qkclip.heads

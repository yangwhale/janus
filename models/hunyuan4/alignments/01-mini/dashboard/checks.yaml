footer:
- '## 逐元素函数的精度'
- ''
- 逐元素函数在 TPU 上做了 ulp 检查（L1 表「逐元素函数」各行，`results/tpu-elementwise-ulp.json`）：XLA 默认的 FP32 exp / log / sigmoid / silu 是近似实现，ulp_max 105 / 62 / 83 / 86，超过 CUDA 文档给 GPU 的门槛；rsqrt、relu、clamp、加乘与类型转换过。下表先按代码列出每个函数在两边的计算精度；「检查」一栏说的是检查做没做，不是两边是否相同。
- ''
- 出处：TPU 为 MaxText 混元 4 集成分支（`d723fa2d`）在 T1 配置（`hy4-mini-t1.yml` + 模型 yml）下的代码路径；GPU 为 `frameworks/megatron/hy4_mcore.py` 与 Megatron-Core 0.20。Transformer Engine（TE）融合算子内部的精度没有源码可查，标「待核」。
- ''
- '| 函数 | 用在哪 | TPU（MaxText） | GPU（Megatron + TE） | 两边 | 检查 |'
- '|---|---|---|---|---|---|'
- '| sigmoid | iHC pre / post、hc_head | FP32（`mhc.py` `gates`） | FP32（`Hy4HyperConnection`，autocast 关） | dtype 相同；TPU 的 FP32 sigmoid 是近似实现，精度不同（对齐细节 D14） | 逐元素 ulp（`L1.elem.sigmoid.fp32` ❌，D14）；hy4-mini 单算子 iHC 混合、写回与 hc_head（✅） |'
- '| sigmoid | 路由打分 | FP32（`float32_gate_logits`） | FP32（Megatron-Core `moe_utils`） | dtype 相同；TPU 的 FP32 sigmoid 是近似实现，精度不同（对齐细节 D14） | 逐元素 ulp（`L1.elem.sigmoid.fp32` ❌，D14）；hy4-mini 单算子 MoE 整块里间接比（✅） |'
- '| sigmoid | 输出门 | FP32 算、舍成 BF16 后乘（`attention_mla.py`） | BF16 输入、BF16 输出（`torch.sigmoid(gate)`，`hy4_mcore.py`） | **不同**（未处理，对齐细节第 5 节 D10） | 只在注意力整块里间接比；L3 第 1 步 linear_gate 梯度 R ≤ 0.98 |'
- '| silu | 稠密 MLP、共享专家、路由专家 | FP32 算、输出舍 BF16，乘积再舍一次（`mlp_activation_round_per_op`） | BF16 逐算子（非融合 SwiGLU） | 舍入点相同（按算子舍入；TPU 用开关对上，台账 M10）；TPU 的 FP32 silu 是近似实现（D14） | 逐元素 ulp（`L1.elem.silu.fp32` ❌，D14）；稠密 MLP 的 L1（阶段 A 与 hy4-mini，✅）；专家在 hy4-mini 的共享专家、路由专家里间接比（✅） |'
- '| clamp | 路由专家 SwiGLU（gate ≤ 10、up ∈ [−10, 10]） | FP32 里对 BF16 值截断（精确），边界处梯度照 torch.clamp（`mlp_activations_limit_inclusive_grad`） | BF16 `clamp` | 相同（截断不产生舍入） | TPU 上逐位（`L1.elem.clamp.fp32` ✅）；路由专家在 hy4-mini 单算子里间接比（✅） |'
- '| rsqrt | 各 RMSNorm | FP32；scale 舍 BF16，输出只舍一次（`rmsnorm_single_rounding`） | TE 融合 RMSNorm（待核） | 待核 | L1 三个 RMSNorm（阶段 A，GPU 分母是 HF 写法） |'
- '| rsqrt | iHC、hc_head 的归一化因子 | FP32 | FP32 | 相同；hc_head 先归一化再乘（TPU）对先乘再乘因子（GPU），舍入点不同 | L1 iHC 混合与 hc_head（阶段 A） |'
- '| rsqrt | 索引器 k_norm（LayerNorm） | FP32 | FP32 输入（Megatron-Core `dsa.py`），TE LayerNorm 内部待核 | 待核 | L3 索引器梯度 |'
- '| exp / softmax | 注意力 | FP32 在线 softmax，用 exp2（splash，`sa_use_base2_exp`），sink 作初始最大值 | FP32 `torch.softmax`，sink 拼成一列 | dtype 相同、算法不同；TPU 的 FP32 exp 是近似实现（D14） | 只在注意力整块里间接比 |'
- '| exp / softmax | KD 教师分布 | FP32 | FP32（Megatron-Core `dsa_masking`） | dtype 相同；TPU 的 FP32 exp 是近似实现，精度不同（对齐细节 D14） | L1 KD 输入（R ≤ 1.2） |'
- '| log_softmax / log-sum-exp | 主损失、MTP 损失 | FP32 | FP32 | dtype 相同；TPU 的 FP32 exp / log 是近似实现，精度不同（对齐细节 D14） | hy4-mini 单算子交叉熵（✅）；L4 loss、MTP loss |'
- '| log_softmax / log-sum-exp | 索引器 KD（学生） | FP32 `jax.nn.log_softmax` | FP32 `torch.log_softmax` | dtype 相同；TPU 的 f32 结果平均比 FP64 低约 1 格（实测，`t1-layer0-kd-attribution.json`），来自近似 exp / log（D14） | L1 KD 值（诊断）；L4 KD 过（M50 后，D1） |'
- '| log(max(p, 1e-10)) | 索引器 KD（教师目标） | FP32，p = 0 的项不计（`indexer_kd_mcore_log`） | 同（Megatron-Core `dsa_indexer_loss`） | 写法相同（TPU 用开关对上，台账 M20）；TPU 的 FP32 log 是近似实现（D14） | L1 KD 值（诊断） |'
- '| relu | 索引器分数 | FP32（`indexer_fp32_scores`） | FP32 | 相同（TPU 用开关对上，台账 M23） | L1 KD 输入 |'
- '| 除法 / 归一化 | 路由权重 w / (Σw + 1e-20)；KD 的 L1 归一化 / max(Σ, 1e-10)；NS 前 / max(‖x‖, 1e-7) | FP32 | FP32 | dtype 相同 | 路由权重在 hy4-mini 单算子 MoE 整块里间接比；NS 与 KD 有 MaxText 单测（台账 M17、M20）；Adam 的 m̂ / (√v̂ + eps) 里 TPU 的 FP32 开方与除法不精确，由 M34 修正（对齐细节 D17） |'
- '| sqrt | QK-Clip 的 √scale；Muon 缩放；索引器 H^-0.5 · d^-0.5 | FP32 | FP32 | 相同（Muon 缩放两边都是 √max(1, fan_out / fan_in)，台账 G18） | 尚未覆盖 |'
- '| softplus | — | 混元 4 不用 | 不用（Megatron-Core 只有 `sqrtsoftplus` 路由打分一支，没选） | — | 不适用 |'
- ''
- '## 已知的覆盖缺口'
- ''
- 下面几处没有覆盖，或者读代码时发现两边写法不同、还没核实；它们不改变上面任何一格的判定，但限定了结论的范围。按级的缺口与补法见[对齐细节第 4 节「覆盖缺口」](DETAILS.md#覆盖缺口)。逐张量的比较在第 0、1 步（路由一致率另有第 8、30、100 步，优化器回放 8 步）；多步只比标量曲线。
- ''
- '| 缺口 | 现状 | 补做的办法 |'
- '|---|---|---|'
- '| iHC post 与写回没有单独比 | MaxText 不把 post 单独输出 | 加观测点，或在逐层回放里比流的状态 |'
- '| MoE 路由的归一化与缩放没有单独的观测点 | 路由 logits、路由专家、共享专家与 MoE 整块都比过 | 加观测点 |'
- '| 输出门 sigmoid 两边写法不同 | GPU 在 BF16 上算，TPU 在 FP32 里算再舍 BF16（对齐细节 D10），第 1 步梯度上没看到影响 | 看要不要加开关对上 |'
- '| 现行配置没有扰动运行 | TPU 被测只有 `t1zg-a` 与同设置重跑 `t1zg-b`，没有只改执行参数的运行 | 只改执行参数跑几份 |'
- '| GPU 一侧自身的噪声与演练 | 只有 L4 尺子用的 28 对；GPU 自比、确定性与故障演练没做（[`gpu-noise/`](gpu-noise/README.md)） | 照 gpu-noise 的计划补 |'
- '| L1、L2 不全在现行配置上 | L1 索引器 KD 输入是 t1z 设置、低阈值 QK-Clip 裁剪算法是 t1v 设置（`tw-qk-a`）；L2 逐层回放没有 M42b、M50（现行配置只有第 2–4 层的单层回放，`t1zg-l2-param-grads.json`） | 用现行配置重跑这三项 |'
- '| L3 噪声只有 3 对 | GPU 第 1 步参照三份两两 3 对，签字要求 15 对（对齐细节「离签字还差什么」2c） | 补 GPU 第 1 步参照到 6 份 |'

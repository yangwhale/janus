levels:
- id: L0
  title: L0 · 地基：设置、数据、权重、配置
  purpose: 两边从同一套设置、同一份输入、同一份权重出发
  lead:
  - 目的：证明两边从同一套设置、同一份输入、同一份权重出发。这一级不过，上面各级的差都说不清来源。
  - ''
  - L0 共 {rows} 项检查，检查条数 {checks}（{cols}），张量级比较 {tensors} 次（同上列序）。全部要求逐位相同。
  tables:
  - rows:
    - name: 设置核对：逐步学习率
      what: 两边每一步记下的学习率都等于登记的常数 1e-5。学习率是设置的常数，不是观测量，所以归设置核对、不进 L4（`PROTOCOL.md` 变更记录 2026-11-07「报告口径」一行）
      objects: '`lr`，TPU 被测与 GPU 基线各自第 1–1000 步。被测是现行比较 `tc-a`（C 口径，base2 关）'
      src:
        mini: tc-l0-settings:L0.settings.lr
    - name: 检查点张量名、形状、dtype
      what: HF 目录里每个张量的名字、形状、dtype 逐个等于形状表与 dtype 表，参数量对上
      objects: mini：hy4-mini 的随机初始化 HF 目录（`make_tiny_hf.py --config mini`，清单 sha256 登记在 `PROTOCOL.md` 第 1.1 节）；真实权重：hy4-preview 截层的 HF 目录（135 个张量）
      src:
        real: hy4-l0-names:*
        mini: hy4-mini-l0-names:*
      info: true
    - name: 权重转换往返
      what: HF 权重转成 MaxText 检查点后，逐张量还原回 HF 对原件逐位，加转换前后两份 dtype 清单
      objects: mini：hy4-mini 的 HF 目录（212 个张量）；真实权重阶段 A / B / C / D 各一份
      src:
        real:
        - hy4-a-l0-ckpt-convert:*
        - hy4-b-l0-ckpt-convert:*
        - hy4-c-l0-ckpt-convert:*
        - hy4-d-l0-ckpt-convert:*
        mini: hy4-mini-l0-ckpt-convert:*
    - name: RoPE 列去交错
      what: 检查点的 q_pe / k_pe 交错存放，转换时去交错（偶数位接奇数位），逆置换逐位回到原件
      objects: mini：hy4-mini（32 个张量）；真实权重阶段 A / B / C / D
      src:
        real:
        - hy4-a-l0-rope:*
        - hy4-b-l0-rope:*
        - hy4-c-l0-rope:*
        - hy4-d-l0-rope:*
        mini: hy4-mini-l0-rope:*
      info: true
    - name: 负对照：不去交错必须判不一致
      what: 不去交错的检查点按去交错的读法核，必须判不一致（证明上一行的核对能抓到错）
      objects: mini：hy4-mini 212 个张量不去交错，往返、RoPE 核对、对 GPU 初始参数清单三处都必须报不一致；真实权重：hy4-tiny CPU 冒烟（阶段 A 结构）
      src:
        real: hy4-cpu-smoke:L0.ckpt.rope.negative_control
        mini: hy4-mini-l0-negative-control:*
    - name: 跨侧初始权重
      what: TPU 载入后的初始权重对检查点、对 GPU 初始参数清单（还原成 GPU 名字、FP32、按 GPU 的分片分 rank）逐位
      objects: mini：两条检查，TPU 载入后清单对检查点复算 0 / 1,647 不同（8 份 × 参数 + 路由偏置），TPU 对 GPU 初始参数清单 0 / 1,968 不同（8 rank × 246）；真实权重：阶段 A（对 `ga-b`、`ga1-a`，248 个）、阶段 B（对 `gb-a`，472 个）
      src:
        real:
        - hy4-a-l0-init-vs-gpu:*
        - hy4-b-l0-init-vs-gpu:*
        mini: t1-l0-init-vs-gpu-mcore:*
      unit: 个参数张量
    - name: 每步输入指纹
      what: TPU 回放的每一步、每个 rank、每个 microbatch 的输入，对 GPU 存下的输入
      objects: mini：TPU `t1zg-a` 回放的 tokens、labels、loss_mask 对 GPU `g3-a` 存下的（台账 G9）；真实权重：`ga-a` 300 步 × 8 rank × 2 microbatch
      src:
        real: hy4-a-replay-check-ga-a:L0.data.fingerprint
        mini: t1zg-l0-data:L0.data.fingerprint
    - name: Muon / Adam 分区
      what: 每个参数走 Muon 还是 Adam、Newton–Schulz 作用在哪个矩阵上，两边逐参数一致
      objects: GPU `g3-a` 的 `optimizer_partition.json`（239 个参数：140 个 Muon / 99 个 Adam，台账 G5）逐个经权重转换映射找到 TPU 上装它的叶子（TPU 表 [`results/hy4-mini-muon-partition.md`](../../results/hy4-mini-muon-partition.md)）
      src:
        mini: t1-l0-muon-partition:L0.optim.partition
    - name: 配置逐项对照
      what: 两边训练配置里必须相同的语义设置逐项对照；另核 TPU 实际生效的精度开关等于 [`config-alignment.md`](config-alignment.md) 登记的对齐值（登记值抄在脚本里，改登记要同步改脚本）
      objects: '现行比较 `tc-a` 实际生效的 MaxText 配置对 `g3-a` 的 meta 与两边共同的 HF `config.json`：结构 37 项对 HF config、训练设置 20 项对 GPU meta、登记值 12 项、精度开关 39 项（含 `sa_use_base2_exp`、C 口径的 M52、M58）。同一脚本对 base2 开的上一代 `t1zg-a` 恰好报 1 项不同（`sa_use_base2_exp`），证明能抓到'
      src:
        mini: tc-l0-config:L0.config.items
    columns:
    - mini
    - real
- id: L1
  title: L1 · 单算子
  purpose: 每个算子单独看，TPU 不比 GPU 离 FP64 真值远
  lead:
  - 目的：把每个算子单独拿出来，看 TPU 和 GPU 是否离 FP64 真值一样近。整网的差是各算子的差叠起来的，这一级定位到具体算子。
  - ''
  - L1 共 {rows} 项检查，检查条数 {checks}（{cols}），张量级比较 {tensors} 次（同上列序）。
  - ''
  - mini 的单算子回放（`t1-l1-op-tpu-r3.json`，被测 `tw-opmini-d`，GPU 分母 Megatron-Core + TE）99 个算子观测点全过（同一种算子在每一层各算一个，加嵌入、输出头、交叉熵等，文件里的 `n_ops_with_R`；按算子种类合成下表的 15 条 `L1.mini3.*` 检查）；它是 base2 开的上一代对齐配置，关 base2 后没有重测，注意力整块（q_a 投影、RoPE、索引器打分与 top-k 等各行）对现行配置是否仍过没有核（PROTOCOL 变更记录 2026-11-11）；真实权重的阶段 A（第 0 层，GPU 分母是 HF 参照模型）只用第 1 步前向、不依赖优化器，仍有效，单列一表。
  - ''
  - ''
  - 回放的注入覆盖全部输入（位置与关键字参数，janus `8cacde9` 起）：每个算子吃的都是 GPU 的同一个输入。
  modules:
    title: 模型的每个算子由哪条检查覆盖
    lead:
    - 按前向顺序列出 hy4-mini 的算子，再列损失与优化器。算子名与语义按两边代码核过：MaxText（混元 4 集成分支）、`frameworks/megatron/hy4_mcore.py`（Megatron-Core 0.20）、HF `hy_v4` 参考实现。
    - ''
    - '- 「判定」列取前三列（有判定的检查）里最差的一条；三列都没有检查的写「尚未覆盖」。'
    - '- 「L3 第 1 步」一列是现行配置训练步的第 1 步梯度对 GPU 第 1 步参照 `g2s-*` 三份下这个算子的参数梯度（或流经它的梯度）：超出 GPU 噪声的张量要对 CPU FP64 参照定责（R ≤ 1.2），N = 0 且两边误差都小于 u = 2^-8 的按分辨率下限过；有超 2N 而未定责的判不过、只有 1–2N 未定责的判待定（规则见 `build.py` 的 `_step1_judge`）。'
    - '- L1、L3 两列的 R 比格子在判定后并排写「GPU a、TPU b → R」：a、b 是两边对参照的 rel_L2（决定 R 的那个算子或张量），R = b ÷ a。只看 R 看不出两边的误差是否都在一次 BF16 舍入（u ≈ 3.9e-3）以下。'
    - '- 「L4」一列是现行比较 `tc-a` 的专项曲线（1000 步）。'
    - '- 「说明」一列写更高一级在哪里间接覆盖、为什么还没单独覆盖。只在整网 L4 loss 里间接体现的，记「尚未覆盖」。'
    - '- 格子与上一行同一列相同时写「同 #k」（k 是第一次出现的行号）。'
    - '- 逐元素函数的 ulp 检查（L1 表「逐元素函数」）不进本表的判定：它不是 TPU 对 GPU 的比较；对用到这些函数的算子，TPU 对 GPU 的比较看 L1 与 L3 两列。'
    - ''
    - 共 {modules_total} 个算子：有判定的检查覆盖且全过 {modules_pass} 个，覆盖但有待定或不过的 {modules_open} 个（其中已定责 {modules_attributed} 个），尚未覆盖 {modules_none} 个。
    columns:
      l1: L1 单算子（hy4-mini 7 层 + MTP，现行开关）
      l3: L3 第 1 步（现行配置训练步梯度，超出 GPU 噪声的对 CPU FP64 定责）
      l4: L4 专项曲线（tc-a 1000 步）
      note: 说明
    count:
    - l1
    - l3
    - l4
    status: 判定
    rows:
    - name: 词嵌入
      does: token id → 1024 维（FP32 表查出转 BF16）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.embed
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.embed
        note: L0 权重转换逐位；L4 loss 间接
    - name: iHC pre：归一化因子
      does: 4 路流拼平后 rsqrt(mean(x²) + eps)，无可学习权重；乘在混合矩阵乘的结果上
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.ihc_mix
        note: 单算子回放比的是混合后的分支输入（`attn_hc.out` / `ffn_hc.out`），pre 的四步合在一起比
    - name: iHC pre：混合矩阵乘（hc_fn）
      does: 'FP32 拼平的流 × hc_fn（TPU `hc_matmul_precision: highest`）'
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.ihc_mix
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.ihc
        note: 单算子回放同上。L3：hc_pre 的 hc_fn / hc_base / hc_scale 的梯度同时流经 pre 与 post；以现行比较 tz-off-rep 为准、GPU 参照 6 份 15 对：超 N 且 R > 1.2 计入未定责的 1 个（第 3 层注意力前 `hc_scale`，1.05 N，待定），按 D11 豁免规则单列（豁免规则与沿用待复核）；MTP enorm 另列，同样按 D11 豁免规则单列（豁免规则与沿用待复核；接受理由见对齐细节 D13）；对齐细节第 4 节注 2；GPU 3 份时未定责 5 个（3 个是关 base2 后新出现的），补到 6 份后其余 4 个在噪声内；第 3 层 `hc_scale` 属于 base2 开那一代单列的 6 个（单层回放（单行）6 个里 5 个 R ≤ 1.2，对齐细节 D11）
    - name: iHC pre：sigmoid
      does: pre = sigmoid(logit · scale + base) + hc_eps
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.ihc_mix
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.ihc
        note: 同上
    - name: iHC pre：加权求和
      does: 4 路流按 pre 加权求和，得到分支输入（TPU 默认用 HIGHEST einsum，HLO 核过编译后是 FP32 逐元素乘 + reduce；开关打开后逐路 FP32 乘加；GPU 是逐元素 FP32 乘加）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.ihc_mix
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.ihc
        note: 同上（TPU 逐路 FP32 乘加，台账 M28）
    - name: iHC post：2·sigmoid
      does: post = 2.0 · sigmoid(logit · scale + base) + hc_eps（`hc_post_magnitude` 2.0）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.ihc_writeback
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.ihc
        note: MaxText 不把 post 单独输出，单算子回放只在 hy4-mini 的 iHC 写回里间接比（post 不单独比）；L3 是 hc_pre 参数的梯度，同时含 pre 与 post 两条路
    - name: iHC post：写回
      does: x_n + post_n · 分支输出（FP32 里算，转回流的精度）；iHC 没有 res_alpha，残差是恒等
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.ihc_writeback
        note: 同上；L4 loss 间接
    - name: 输入 RMSNorm
      does: 注意力前的 RMSNorm（TPU 单次舍入，`rmsnorm_single_rounding`）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.norm
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.input_norm
    - name: MLA q_a 投影
      does: x → q 潜空间（q_lora 512）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.q_a
        note: 只在注意力整块里比
    - name: MLA q_norm
      does: q 潜空间的 RMSNorm（eps 1e-5）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.q_norm
        note: 同上
    - name: MLA q_b 投影
      does: 潜空间 → 8 头 × (nope 192 + rope 64)
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.q_b
        note: 同上
    - name: MLA kv_a 投影
      does: x → kv 潜空间（kv_lora 512）+ 共享的 k_pe（64）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.kv_a
        note: 同上
    - name: MLA kv_norm
      does: kv 潜空间的 RMSNorm（eps 1e-5）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.kv_norm
        note: 同上
    - name: MLA kv_b 投影
      does: 潜空间 → 8 头 × (k_nope 192 + v 256)
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.kv_b
        note: 同上
    - name: MLA RoPE
      does: θ = 1e7，YaRN factor 1（= 普通 RoPE）。检查点交错存放：TPU 转换时去交错、跑拼接式；GPU 运行时去交错（`mla_rotary_interleaved`）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        note: L0 去交错逐位；只在注意力整块里比
    - name: 索引器 wq_b
      does: q 潜空间 → 32 头 × 128
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.indexer_wq_b
        note: 前向只在注意力整块里比；第 1 步梯度含第 0、1、5 层与 MTP 层
    - name: 索引器 wk
      does: x → k（128）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.indexer_wk
        note: 同上
    - name: 索引器 k_norm
      does: k 的 LayerNorm（带 bias，不是 RMSNorm；eps 1e-6），两边都在 FP32 里算
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.indexer_k_norm
        note: 同上
    - name: 索引器 RoPE（每头后 64 维）
      does: 'RoPE 放在每头的后 qk_rope_head_dim 维（`indexer_rope_position: last`；Megatron-Core 原版放前面，GPU 侧改了）'
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.indexer_wq_b
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.indexer_wk
        note: 同上；L3 是流经 RoPE 的 wq_b、wk 的梯度
    - name: 索引器 weights_proj
      does: x → 每头一个权重，乘 H^-0.5 · d^-0.5（BF16 权重、FP32 输出，台账 M27）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.indexer_weights_proj
        note: 同上
    - name: 索引器 ReLU 与按头加权求和
      does: 分数 = Σ_头 w_h · ReLU(q_h · k)（TPU `indexer_fp32_scores` 真 FP32）
      checks:
        l1:
        - t1-layer0-kd-attribution:L1.indexer_kd.inputs
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.indexer_weights_proj
        note: KD 输入一条比的就是这个分数（第 0 层第 0 行）；L3 是流经它的 weights_proj 梯度
    - name: 索引器 top-k（full 层）
      does: 每个 query 选 2048 个 key（第 0、1、5 层与 MTP 层）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        note: 只在注意力整块里间接比；逐层不重合率统计见 L2
    - name: 索引器 top-k（shared 层复用）
      does: 第 2–4、6 层复用本组第一层的 top-k（IndexCache）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        note: hy4-mini 逐算子回放里只在注意力整块里间接比（shared 层用块首层自选的掩码）
    - name: 注意力 logits
      does: q · k × softmax scale（被选中的 2048 个 key + 因果）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        note: 只在注意力整块里比；logits 的精度两边不同，见下方「已知的覆盖缺口」
    - name: 可学习 sink
      does: 每头一个 FP32 logit，作为额外的一列键拼进 softmax，不带 value
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.sink
        note: 同上
    - name: softmax
      does: FP32（TPU 是 splash 的在线 softmax；现行对齐配置 base2 关，用 exp，2026-11-11 前各代用 exp2）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        note: 同上
    - name: 乘 V（PV）
      does: 概率 × V
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        note: 同上
    - name: 输出门投影
      does: x → 8 头 × 256（门控 MLA，读注意力的输入）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.gate_proj
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.gate
        note: 单算子回放比的是投影的输出（sigmoid 之前）
    - name: 输出门 sigmoid 与相乘
      does: out × sigmoid(gate)
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.gate
        note: 只在注意力整块里比；L3 是流经 sigmoid 的 linear_gate 梯度；sigmoid 的精度两边不同（下方逐元素函数表，对齐细节 D10）
    - name: o_proj
      does: 8 头 × 256 → 1024
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.o_proj
        note: 同上
    - name: FFN 前 RMSNorm
      does: 注意力写回之后、FFN 之前的 RMSNorm
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.norm
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.post_norm
    - name: 稠密 MLP（第 0 层）
      does: silu(gate) · up，再 down（3072 宽，不截断）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.dense_mlp
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.dense_mlp
    - name: 路由 logits（FP32）
      does: 'FP32 激活 × 路由权重（TPU 先把权重舍成 BF16，`routed_gate_bf16_rounding`；`router_matmul_precision: highest`）'
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.router_logits
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.router
        note: 阶段 A 没有 MoE；hy4-mini 单算子回放比了路由 logits；L3 是路由权重（`mlp.gate.weight`）的梯度
    - name: 路由 sigmoid 与偏置
      does: sigmoid 打分；路由偏置只参与选择，门控权重用不带偏置的分数
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.moe
        l4:
        - t1zc-l4:L4.router.*
        note: 偏置的逐步更新由 L4 路由偏置曲线比；现行比较两个窗口都过（base2 开的上一代标准差略超、已接受，对齐细节 D23）
      attributed: D23
    - name: 路由 top-k
      does: 16 个专家选 4 个（不分组）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.moe
        l4:
        - t1zc-l4:L4.router.*
        note: 偏置按负载更新，负载由 top-k 决定，所以偏置曲线间接覆盖选择；逐层翻转统计见 L2；现行比较偏置均值、标准差都过（对齐细节 D23 是 base2 开的上一代）
      attributed: D23
    - name: 路由权重归一化与缩放
      does: w / (Σw + 1e-20) × 2.827
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.moe
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.router
        note: 路由权重的梯度流经归一化与缩放（L3 同上一行）；前向没有单独比
    - name: 路由专家（含 SwiGLU 截断）
      does: gate ≤ 10、up ∈ [−10, 10] 截断后 silu(gate) · up，再 down；路由权重 TPU 乘在 down 之后、GPU 乘在 down 之前
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.routed_experts
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.experts
        note: L3 只含 rank 0 本地的 0–3 号专家（GPU 抓数只有这 4 个，台账 G12）；路由权重乘的位置两边不同（舍入点不同，M40 对上）
    - name: 共享专家
      does: silu(gate) · up，再 down（256 宽，不截断）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.shared_expert
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.shared
    - name: hc_head
      does: 4 路流合成 1 路（归一化因子、hc_fn、sigmoid 加权）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.hc_head
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.hc_head
        note: TPU 先归一化再乘、GPU 先乘再乘因子：数学相同、舍入不同；L3 的 R 3.9 不定责：TPU 对 GPU 在 GPU 6 份的噪声内（r 0.32；3 份时 0.72），按噪声过。但这把尺子在这里被撑宽：第 1 步按主 loss / MTP 拆开，hc_head 三个参数加最后的 norm 这组（4 个张量）的梯度误差里，GPU 三份是 MTP 那部分的约 1/4 到 6/10 被丢掉（组中位数 β −0.26、−0.35、−0.61），TPU 是多了约 3/10（+0.31），GPU 三份之间的散布因此变大，「按噪声过」不能说明 R 3.9 是噪声（`results/mini-step1-grad-main-mtp-split.json`，[知识库](../../knowledge.md#mini-主-loss-共同偏高要点与出处)）。注意 TPU 的 β 取自诊断程序（`train_hy4.py --diag-step1`）的梯度，而这一行的 R 3.9 用的是训练步动量反推的梯度，两者分开编译；拿这个 β 解释 R 3.9 还缺一步，要用训练步梯度重算。GPU 为什么丢掉这部分没查（待查）
    - name: 最后的 RMSNorm
      does: hc_head 之后的 RMSNorm
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.norm
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.final_norm
    - name: 输出头（FP32）
      does: 1024 → 120832 维 logits，FP32 权重与输出
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.lm_head
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.lm_head
        note: '现行配置设 `logits_matmul_precision: highest`，TPU 也是真 FP32 矩阵乘（台账 M13）；GPU 的 dgrad 每 1024 个词分段累加（台账 G19）'
    - name: MTP enorm、hnorm
      does: 下一个 token 的嵌入与主干隐状态（hc_head + 最后的 norm 之后）各一个 RMSNorm
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.norm
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.mtp_norms
        note: MTP loss 曲线间接；L3 现行训练步梯度（tz-off-rep）下 `enorm` R 1.24（GPU 1.57e-3，TPU 1.94e-3，超 N 1.44 倍），两边都小于 u = 2^-8，另列、不进未定责计数，按 D11 豁免规则单列（豁免规则与沿用待复核；接受理由见对齐细节 D13）；base2 开的上一代 R 1.18
    - name: MTP 拼接与 eh_proj
      does: '[嵌入, 隐状态] 拼成 2048 维，投影回 1024'
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.eh_proj
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.mtp_eh_proj
        note: 同上
    - name: MTP 的 transformer 层（注意力、MoE）
      does: 一层 MoE 层（不带超连接；索引器自己算 top-k）
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        - t1-l1-op-tpu-r3:L1.mini3.moe
        l3:
        - t1zo-step1-train-grad-vs-fp64-n6:L3.step1.ref.op.mtp_layer
        note: 其中的索引器算在上面索引器各行（L3 索引器各组含 MTP 层的张量）；前向在单算子回放里比了注意力整块与 MoE 整块
    - name: 主损失（交叉熵）
      does: 逐 token 交叉熵，eod 位置不算（`loss_mask`），按全局有效 token 数平均
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.cross_entropy
        l4:
        - t1zc-l4:L4.loss
        - t1zc-l4:L4.loss.tail
    - name: MTP 损失
      does: 预测下下个 token 的交叉熵 × 0.1（两边都读 MaxText 口径 `mtp_loss_mt`）
      checks:
        l4:
        - t1zc-l4:L4.mtp_loss*
    - name: 索引器 KD 损失
      does: KL(教师注意力分布 ‖ 索引器分布)，各产出层平均 × 0.1
      checks:
        l1:
        - t1-layer0-kd-attribution:L1.indexer_kd.inputs
        l4:
        - t1zc-l4:L4.indexer_loss
        note: 1000 步与前 300 步都过（打开 M50 后，对齐细节 D1）；第 0 层 KD 值的诊断见 L1 表
    - name: Muon：Newton–Schulz
      does: 5 步，系数 (3.4445, −4.7750, 2.0315)；归一化 x / max(‖x‖, 1e-7)
      checks:
        l1:
        - t1-optim-replay-adam-acc-r2-tpu:L1.optim_adam_r2.tpu_adam_acc
        note: L1 是优化器连续 8 步回放（对齐细节 D17）；另有 MaxText 单测对 Megatron-Core 的固定参照（台账 M15–M17）
    - name: Muon：Nesterov
      does: β = 0.95，方向 = β · mu_t + (1 − β) · g_t，不做偏差修正
      checks:
        l1:
        - t1-optim-replay-adam-acc-r2-tpu:L1.optim_adam_r2.tpu_adam_acc
        note: 同上
    - name: Muon：更新缩放
      does: √max(1, fan_out / fan_in)
      checks:
        l1:
        - t1-optim-replay-adam-acc-r2-tpu:L1.optim_adam_r2.tpu_adam_acc
        note: '同上；两边公式相同（GPU `muon_scale_mode: shape_scaling`，台账 G18）'
    - name: Muon：分区
      does: 哪些参数走 Muon（iHC 矩阵走 Adam、gate / up 拼接正交化、输出门每头一个矩阵）
      checks:
        note: L0 逐参数对拍
        l1:
        - t1-l0-muon-partition:L0.optim.partition
    - name: 标量参数的 Adam
      does: 普通 Adam（不是 NAdam），β 0.9 / 0.95，ε 1e-10，权重衰减 0
      checks:
        l1:
        - t1-optim-replay-adam-acc-r2-tpu:L1.optim_adam_r2.tpu_adam_acc
        note: 同上；另有 MaxText 单测对 torch Adam（台账 M16）
    - name: QK-Clip
      does: 每层每头 scale = min(1, 100 / 最大 logit)（最大 logit 只取选中且因果的位置，不含 sink），q_b / kv_b 的 nope 列 × √scale、rope 列 × scale；梯度累积时最大 logit 取最大
      checks:
        l1:
        - t1-qk-clip-tpu:L1.qkclip.formula
        - t1zo-qkclip-maxlogit:L1.qkclip.max_logit
        note: T1 的 τ 100 下从未触发；L1 是 τ 0.1 的 30 步对比：裁剪算法过（打开 M31、M33 之前的设置）；第 1 步逐头最大 logit 在 base2 开时过（对齐细节 D15），关 base2 的现行配置下不过（第 4 层 R 1.55，一个头差 −1.19e-2，D31 未定责）；L4 的 QK-Clip 全局最大 logit 曲线见 L4 表 `L4.qkclip.max_logit`（τ 100 下没触发，比的是记录值）；MaxText 单测见台账 M1、M18、M19，最大 logit 不含 sink 见 M25
    same_as_above: true
  tables:
  - title: 单算子回放（阶段 A 真实权重，第 1 步前向）
    lead:
    - 每个算子的输入换成 GPU `ga1-a` 第 1 步抓到的同一个输入，抓 TPU 这个算子的输出，对 GPU 侧 FP64 单算子回放存下的真值算 R。参考档的「rel_L2 对 GPU」是同一输入下 TPU 输出对 GPU 输出。
    rows:
    - name: iHC 混合与 hc_head
      what: 注意力前 / FFN 前的 iHC 混合（pre 的四步）与 hc_head
      objects: '`attn_hc.out`、`ffn_hc.out`、`hc_head`'
      src:

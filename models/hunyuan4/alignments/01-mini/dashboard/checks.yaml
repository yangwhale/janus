  - '- 每条序列算三个判定量：带符号均值、MARE、最大单步；三个都对 N 判，取最差。格子写最差那个判定量的 TPU 实测（括号里是名字、实测 ÷ N 的倍数，N 与判法栏不同时另写 N）。首步差只报。'

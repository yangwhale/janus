        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64:L3.step1.ref.op.gate
        note: 只在注意力整块里比；L3 是流经 sigmoid 的 linear_gate 梯度；sigmoid 的精度两边不同（下方逐元素函数表，对齐细节 D10）
    - name: o_proj
      does: 8 头 × 256 → 1024
      checks:
        l1:
        - t1-l1-op-tpu-r3:L1.mini3.attn
        l3:
        - t1zo-step1-train-grad-vs-fp64:L3.step1.ref.op.o_proj
        note: 同上
    - name: FFN 前 RMSNorm
      does: 注意力写回之后、FFN 之前的 RMSNorm
      checks:

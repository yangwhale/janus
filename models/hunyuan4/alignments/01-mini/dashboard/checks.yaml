    - name: 低阈值 QK-Clip：裁剪的算法
      what: τ 0.1、30 步（GPU `g6-qk-a/b`，TPU `tw-qk-a`，打开 M31、M33 之前的设置）：TPU 裁剪后的 q / kv 上投影主权重 ≟ GPU 裁剪前的主权重 × TPU 自己记下的 η（Megatron-Core 的行规则，α 0.5）。门槛 1e-3 是推断（`analysis/qk_clip_compare.py` 开头）：残差只剩两边这一步优化器更新的差，一次更新约 lr·O(1) = 1e-5，裁剪改变量约 (1−η)·|W| ≈ 1e-1 × 6e-3，比值约 1e-4，取 10 倍余量；GPU 自己的同一量 1.7e-6

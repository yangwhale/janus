# 混元 4 · T1 生产配方臂 P1（2026-11-11）：现行对齐配置（含 base2 关）上只改三项——学习率峰值 2e-5、cosine（终点 0.1）、warmup 200；
# YaRN factor 8（MLA 与索引器的 RoPE 频率插值，不乘 mscale）；路由偏置零均值两边都开。权重衰减生产值未知，保持 0。
# 被测 TPU p1t-a，基线 GPU p1g-a；尺子是同配方 GPU 8 份 p1g-a … p1g-h 两两 28 对（同一代码包、同一参数，p1g-c … h 是 2026-11-11 补跑的 6 份）。
schema_version: 1
model: hunyuan4-mini
stage: t1pr-l4-gpu8
description: T1 生产配方臂 1000 步，TPU p1t-a 被测，GPU p1g-a 为基线，尺子是同配方 GPU 8 份两两 28 对
runs:
  test: p1t-a
  golden: [p1g-a]
  noise:
    - [p1g-a, p1g-b]
    - [p1g-a, p1g-c]
    - [p1g-a, p1g-d]
    - [p1g-a, p1g-e]
    - [p1g-a, p1g-f]
    - [p1g-a, p1g-g]
    - [p1g-a, p1g-h]
    - [p1g-b, p1g-c]
    - [p1g-b, p1g-d]
    - [p1g-b, p1g-e]
    - [p1g-b, p1g-f]
    - [p1g-b, p1g-g]
    - [p1g-b, p1g-h]
    - [p1g-c, p1g-d]
    - [p1g-c, p1g-e]
    - [p1g-c, p1g-f]
    - [p1g-c, p1g-g]
    - [p1g-c, p1g-h]
    - [p1g-d, p1g-e]
    - [p1g-d, p1g-f]
    - [p1g-d, p1g-g]
    - [p1g-d, p1g-h]
    - [p1g-e, p1g-f]
    - [p1g-e, p1g-g]
    - [p1g-e, p1g-h]
    - [p1g-f, p1g-g]
    - [p1g-f, p1g-h]
    - [p1g-g, p1g-h]
  root: /data/janus-runs
checks:
  - {id: L4.loss, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "1:1001"}, params: {baseline: p1g-a}, threshold: calibrated}
  - {id: L4.loss.tail, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "101:1001"}, params: {baseline: p1g-a}, threshold: calibrated}
  - {id: L4.mtp_loss, type: loss_series, level: L4, select: {kind: metrics, field: mtp_loss_mt, window: "1:1001"}, threshold: calibrated}
  - {id: L4.mtp_loss.tail, type: loss_series, level: L4, select: {kind: metrics, field: mtp_loss_mt, window: "101:1001"}, threshold: calibrated}
  - {id: L4.indexer_loss, type: loss_series, level: L4, select: {kind: metrics, field: indexer_loss, window: "1:1001"}, threshold: calibrated}
  - {id: L4.grad_norm, type: loss_series, level: L4, select: {kind: metrics, field: grad_norm, window: "1:1001"}, threshold: calibrated}
  - {id: L4.param_norm, type: loss_series, level: L4, select: {kind: metrics, field: param_norm_fp64, test_field: param_norm_exact, window: "1:1001"}, threshold: calibrated}
  - {id: L4.router.bias_mean, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_mean.", window: "1:1001"}, threshold: calibrated}
  - {id: L4.router.bias_std, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_std.", window: "1:1001"}, threshold: calibrated}

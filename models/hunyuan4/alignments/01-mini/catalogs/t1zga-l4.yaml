# 混元 4 · T1 1000 步，TPU t1zg-a：t1zw-a 的配置再开 indexer_kd_generalized_kl（索引器 KD 记录值改用广义 KL，梯度不变），MaxText 47d31984；被测 t1zg-a，GPU g3-a 为基线，噪声 g3-* 两两 28 对。
schema_version: 1
model: hunyuan4-mini
stage: t1zga-l4
description: T1 L4 1000 步，TPU t1zg-a（t1zw-a + indexer_kd_generalized_kl）被测，GPU g3-a 为基线，GPU 噪声 28 对
runs:
  test: t1zg-a
  golden: [g3-a]
  noise:
    - [g3-a, g3-b]
    - [g3-a, g3-c]
    - [g3-a, g3-d]
    - [g3-a, g3-e]
    - [g3-a, g3-f]
    - [g3-a, g3-g]
    - [g3-a, g3-h]
    - [g3-b, g3-c]
    - [g3-b, g3-d]
    - [g3-b, g3-e]
    - [g3-b, g3-f]
    - [g3-b, g3-g]
    - [g3-b, g3-h]
    - [g3-c, g3-d]
    - [g3-c, g3-e]
    - [g3-c, g3-f]
    - [g3-c, g3-g]
    - [g3-c, g3-h]
    - [g3-d, g3-e]
    - [g3-d, g3-f]
    - [g3-d, g3-g]
    - [g3-d, g3-h]
    - [g3-e, g3-f]
    - [g3-e, g3-g]
    - [g3-e, g3-h]
    - [g3-f, g3-g]
    - [g3-f, g3-h]
    - [g3-g, g3-h]
  root: /data/janus-runs
checks:
  - {id: L4.loss, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "1:1001"}, params: {baseline: g3-a}, threshold: calibrated}
  - {id: L4.loss.tail, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "101:1001"}, params: {baseline: g3-a}, threshold: calibrated}
  - {id: L4.mtp_loss, type: loss_series, level: L4, select: {kind: metrics, field: mtp_loss_mt, window: "1:1001"}, threshold: calibrated}
  - {id: L4.mtp_loss.tail, type: loss_series, level: L4, select: {kind: metrics, field: mtp_loss_mt, window: "101:1001"}, threshold: calibrated}
  - {id: L4.indexer_loss, type: loss_series, level: L4, select: {kind: metrics, field: indexer_loss, window: "1:1001"}, threshold: calibrated}
  - {id: L4.grad_norm, type: loss_series, level: L4, select: {kind: metrics, field: grad_norm, window: "1:1001"}, threshold: calibrated}
  - {id: L4.param_norm, type: loss_series, level: L4, select: {kind: metrics, field: param_norm_fp64, test_field: param_norm_exact, window: "1:1001"}, threshold: calibrated}
  - {id: L4.router.bias_mean, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_mean.", window: "1:1001"}, threshold: calibrated}
  - {id: L4.router.bias_std, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_std.", window: "1:1001"}, threshold: calibrated}

# 混元 4 · T1 L4：QK-Clip 曲线（每步全局最大注意力 logit；被裁头数见 results/t1mz-health.results.json）。被测 mz-g1q：mz-g1（现行 yml，
# MaxText fd30fbfb，再开 qk_clip_log_per_head 只记录逐层逐头的最大 logit；1000 步逐位等于 t1zg-b）派生出 max_attention_logit
# = 各层（含 MTP）各头 qk.max_logit 的最大值，与 GPU 的 max_attention_logit 同义（全局最大缩放 q·k，不含 sink）。
schema_version: 1
model: hunyuan4-mini
stage: t1mz300-l4-qkclip
description: T1 L4 QK-Clip 曲线（每步全局最大 logit），mz-g1q 被测，GPU g2-a 为基线，GPU 噪声 28 对
runs:
  test: mz-g1q
  golden: [g2-a]
  noise:
    - [g2-a, g2-b]
    - [g2-a, g2-c]
    - [g2-a, g2-d]
    - [g2-a, g2-e]
    - [g2-a, g2-f]
    - [g2-a, g2-g]
    - [g2-a, g2-h]
    - [g2-b, g2-c]
    - [g2-b, g2-d]
    - [g2-b, g2-e]
    - [g2-b, g2-f]
    - [g2-b, g2-g]
    - [g2-b, g2-h]
    - [g2-c, g2-d]
    - [g2-c, g2-e]
    - [g2-c, g2-f]
    - [g2-c, g2-g]
    - [g2-c, g2-h]
    - [g2-d, g2-e]
    - [g2-d, g2-f]
    - [g2-d, g2-g]
    - [g2-d, g2-h]
    - [g2-e, g2-f]
    - [g2-e, g2-g]
    - [g2-e, g2-h]
    - [g2-f, g2-g]
    - [g2-f, g2-h]
    - [g2-g, g2-h]
  root: /data/janus-runs
checks:
  - {id: L4.qkclip.max_logit, type: loss_series, level: L4, select: {kind: metrics, field: max_attention_logit, window: "1:301"}, threshold: calibrated}

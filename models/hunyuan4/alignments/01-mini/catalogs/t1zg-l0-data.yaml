# 混元 4 · T1（hy4-mini）L0 每 rank 每步输入指纹：TPU 回放 GPU golden 存下的 batch，两边各自对每个 rank、每个 microbatch 记
# tokens / labels / loss_mask / position_ids 的 sha256 与非 padding 数（TPU：train_hy4.py；GPU：janus/dump/megatron.py），逐位比。
# 被测 t1zg-a（现行比较），参照 g3-a（它回放的那份 golden），1000 步 × 8 rank × 2 microbatch × 4 字段 + 每步非 padding 总数。
# 首步 loss 跨平台不逐位，不在这里比（L3 / L4 比）。跨侧初始权重另见 results/t1-l0-init-vs-gpu-mcore.results.json（GPU 是 Megatron 名字，
# 清单写法不同，不走 checkpoint_equal 的清单模式）。
schema_version: 1
model: hunyuan4-mini
stage: t1zg-l0-data
description: T1 L0 每 rank 每步输入指纹（t1zg-a 回放 g3-a 的 batch，1000 步逐位）
runs:
  test: t1zg-a
  golden: [g3-a]
  root: /data/janus-runs
checks:
  - {id: L0.data.fingerprint, type: data_fingerprint, level: L0, select: {kind: tokens, steps: "1:1001"}, params: {first_loss: false}}

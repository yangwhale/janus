# 混元 4 · T1（hy4-mini）设置核对：两边每一步记下的学习率都等于登记的常数（PROTOCOL.md 第 1.2 节：常数 1e-5）。
# 学习率是我们设的，不是观测量：这里只核对「设置真的生效了」，属于 L0 地基（配置），不进 L4 的比较，
# 也不计入 L4 的过 / 不过 / 待定（2026-11-07 报告口径变更，见 PROTOCOL 变更记录）。
# 被测 tc-a（TPU，现行比较 2026-11-11 起：C 口径，M36、M52、M58 都开，含 M50，sa_use_base2_exp: false），参照 g3-a（GPU 基线，1000 步）。上一代被测 tz-off-rep（tzoff-l0-settings）。
schema_version: 1
model: hunyuan4-mini
stage: tc-l0-settings
description: T1 设置核对（逐步学习率等于登记的常数 1e-5，两边都要），TPU tc-a 对 GPU g3-a
runs:
  test: tc-a
  golden: [g3-a]
  root: /data/janus-runs
checks:
  - {id: L0.settings.lr, type: scalar_series, level: L0, select: {kind: metrics, field: lr, window: "1:1001"}, params: {equals: 1.0e-5, rtol: 0.0, abs_ulp: 0}}

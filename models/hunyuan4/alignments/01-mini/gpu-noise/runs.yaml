# 00 · GPU 自比与演练（T1，hy4-mini）· 运行清单。数据位置写成占位，不写桶名。
# 已有的运行是 T1 的 GPU 正式运行（01 的 L4 也用它们）；标「计划」的还没跑。
schema: 1
alignment: 01-mini/gpu-noise
code: {framework: "Megatron-Core 0.20 + TE 2.20.2（NeMo 26.10 镜像所带；meta.json 不记 TE 版本，2026-11-11 在同一 digest 的训练 Pod 里实测，见 ../setup.md「软件版本」）", janus: 见各运行的 meta.json, image: 见各运行的 meta.json}
batches:
  - name: T1 GPU 同设置重跑，g3 一代再 8 份（1000 步尺子扩到 16 份）
    runs: [g3-i, g3-j, g3-k, g3-l, g3-m, g3-n, g3-o, g3-p]
    steps: 1000
    setting: 与 g3-a … g3-h 同一代码包（hy4_mcore 4dab75aa、train 1763d7ed）、同一 pod_run.sh、同镜像、同参数（不带 --save-batches）；单机 B200 × 8，DP 8 + EP 4
    location: "gs://<POC 桶>/janus/hunyuan4/golden-t1/g3-*/"
    results: [g3x16-noise, g3x16-noise-vs-8]
    note: 与 g3-a … g3-h 一起两两 120 对（catalogs/g3x16-noise.yaml）
  - name: T1 GPU 同设置重跑（噪声参照），g1 一代（注意力 q·k 在 BF16 里算）
    runs: [g1-a, g1-b, g1-c, g1-d, g1-e, g1-f, g1-g, g1-h]
    steps: 300
    setting: 默认设置；T1 的 GPU 配置（PROTOCOL.md 第 1.2 节）
    location: "gs://<POC 桶>/janus/hunyuan4/…（各运行的 meta.json）"
    results: []
    note: 两两 28 对是 01 里前三代比较（t1-l4、t1-l4-nozm、t1s-l4）的噪声尺子
  - name: T1 GPU 同设置重跑（噪声参照），g2 一代（q·k 在 FP32 里算，台账 G17）
    runs: [g2-a, g2-b, g2-c, g2-d, g2-e, g2-f, g2-g, g2-h]
    steps: 300
    setting: 默认设置；g1 的设置只改 --attn-scores-fp32
    location: "gs://<POC 桶>/janus/hunyuan4/…（各运行的 meta.json）"
    results: [g2-meta-vs-g3a]
    note: 以现行比较 tc-a 为准：两两 28 对是 01 里前 300 步窗口的噪声尺子（现行 t1zc300-l4；C 口径之前 t1zo300-l4；再上一代 t1zga300-l4、t1mz300-l4-qkclip；更早各代 t1zw300-l4、t1zu300-l4、t1zv300-l4、t1zr300-l4、t1zs300-l4、t1zt300-l4、t1zub300-l4、t1zuc300-l4、t1zud300-l4、t1z-l4、t1v-l4、t1t-l4）；GPU 自比（catalogs/t1-gpu-noise.yaml）还没跑
  - name: T1 GPU 同设置重跑（噪声参照），g3 一代（g2 的设置跑 1000 步）
    runs: [g3-a, g3-b, g3-c, g3-d, g3-e, g3-f, g3-g, g3-h]
    steps: 1000
    setting: 默认设置；g2 的设置
    location: "gs://<POC 桶>/janus/hunyuan4/…（各运行的 meta.json）"
    results: []
    note: 以现行比较 tc-a 为准：与 g3-i … g3-p 一起 16 份两两 120 对是现行 t1zc-l4（C 口径之前 t1zo-l4）的噪声尺子；这 8 份两两 28 对是 2026-11-11 前 01 里 1000 步各次比较（上一代 t1zga-l4；更早各代 t1zw-l4、t1zu-l4、t1zv-l4、t1zr-l4、t1zs-l4、t1zt-l4、t1zub-l4、t1zuc-l4、t1zud-l4、t1zk-l4、t1w-l4、t1u-l4）的噪声尺子
  - name: 16 份尺子重判（知识库旁注，不改原判档）
    runs: [t1zg-a, t1zw-a, t1zz-a, tz-off-nolhs, ts-c-nolhs-1k]
    steps: 1000
    setting: TPU 运行是 01 与 04 里已有的；GPU g3-a 为基线，噪声 g3-a … g3-p 两两 120 对
    results: [t1zga-l4-n16, t1zwa-l4-n16, t1zza-l4-n16, tzoffnolhs-l4-n16, tsnolhs-l4-n16]
    note: base2 开的 t1zg-a、t1zw-a 9 项全过；base2 关的 t1zz-a、tz-off-nolhs 与 ts-c-nolhs-1k 过 7、待定 2（主 loss 全程、后段）；出处被知识库「mini 上关 base2 为什么离 GPU 更远」与 01 results/grad-norm-denominator-rejudge.md 引用
  - name: T1 GPU 第 1 步全量抓数参照
    runs: [g1s-a, g1s-b, g1s-c, g2s-a, g2s-b, g2s-c, g2s-d, g2s-e, g2s-f]
    steps: 1
    setting: 不重算、全量抓数（台账 G12、G15）；g2s-d、g2s-e、g2s-f 是 2026-11-11 同设置补跑的（同一代码包 janus-hy4-37ccee82cf33、同一 pod_run.sh、同镜像、同附加参数，单机 B200 × 8）
    location: "gs://<POC 桶>/janus/hunyuan4/megatron/<作业名>/runs/g2s-*/"
    results: [g2-meta-vs-g3a, g2s6-meta-vs-g2sa]
    note: 各份两两的逐张量散布进 01 第 1 步比较的结果文件（gpu_noise_max）；g1s 中位数 rel_L2 2.7e-3（台账 G15）；g2s 6 份两两 15 对的中位数 2.48e-3，新旧两批之间没有批次差（g2s6-meta-vs-g2sa.json）
  - name: 确定性设置（计划）
    runs: [g1det-a, g1det-b]
    steps: 300
    setting: 确定性设置；其余同 T1
    results: []
    note: 计划，还没跑（catalogs/t1-gpu-determinism.yaml）
  - name: 故障演练（计划）
    runs: []
    setting: 确定性基线上埋一个错（9 种）
    results: []
    note: 计划，还没跑；确定性基线可用 05 的确定性模式（hy4-mini 两次 20 步逐位，05-gpu-scale/results/ckpt-rerun-dp8.json），它与 golden 差在确定性模式与步数，演练前要在确定性模式下跑够步数

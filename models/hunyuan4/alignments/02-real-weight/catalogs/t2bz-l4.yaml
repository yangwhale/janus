# 混元 4 · T2 B，TPU 现行设置（t1z 的全部开关，qk_clip_max_logit_exclude_sink 暂关）被测 tb3-b，GPU gb2-a 为基线，噪声 gb2-* 两两 28 对。
schema_version: 1
model: hunyuan4-trunc
stage: t2bz-l4
description: T2 阶段 B L4，300 步（TPU tb3-b（现行设置）被测，GPU gb2-a 为基线，GPU 噪声 28 对）
runs:
  test: tb3-b
  golden: [gb2-a]
  noise:
    - [gb2-a, gb2-b]
    - [gb2-a, gb2-c]
    - [gb2-a, gb2-d]
    - [gb2-a, gb2-e]
    - [gb2-a, gb2-f]
    - [gb2-a, gb2-g]
    - [gb2-a, gb2-h]
    - [gb2-b, gb2-c]
    - [gb2-b, gb2-d]
    - [gb2-b, gb2-e]
    - [gb2-b, gb2-f]
    - [gb2-b, gb2-g]
    - [gb2-b, gb2-h]
    - [gb2-c, gb2-d]
    - [gb2-c, gb2-e]
    - [gb2-c, gb2-f]
    - [gb2-c, gb2-g]
    - [gb2-c, gb2-h]
    - [gb2-d, gb2-e]
    - [gb2-d, gb2-f]
    - [gb2-d, gb2-g]
    - [gb2-d, gb2-h]
    - [gb2-e, gb2-f]
    - [gb2-e, gb2-g]
    - [gb2-e, gb2-h]
    - [gb2-f, gb2-g]
    - [gb2-f, gb2-h]
    - [gb2-g, gb2-h]
  root: /data/janus-runs
checks:
  - {id: L4.loss, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "1:301"}, params: {baseline: gb2-a}, threshold: calibrated}
  - {id: L4.loss.tail, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "101:301"}, params: {baseline: gb2-a}, threshold: calibrated}
  - {id: L4.indexer_loss, type: loss_series, level: L4, select: {kind: metrics, field: indexer_loss, window: "1:301"}, threshold: calibrated}
  - {id: L4.grad_norm, type: loss_series, level: L4, select: {kind: metrics, field: grad_norm, window: "1:301"}, threshold: calibrated}
  - {id: L4.param_norm, type: loss_series, level: L4, select: {kind: metrics, field: param_norm_fp64, test_field: param_norm_exact, window: "1:301"}, threshold: calibrated}
  - {id: L4.router.bias_mean, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_mean.", window: "1:301"}, threshold: calibrated}
  - {id: L4.router.bias_std, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_std.", window: "1:301"}, threshold: calibrated}

# 混元 4 · T2 B 1000 步设置核对（TPU tb5b-a，GPU gb3-a）：两边每一步学习率等于 1e-5。
# 同 t2b5-l0-settings.yaml，只把测试运行换成现行代 tb5b-a（与 t2b5b-l4.yaml 同一对运行；写于 tb5b-a 跑完之后补核）。
schema_version: 1
model: hunyuan4-trunc
stage: t2b5b-l0-settings
description: T2 B 1000 步设置核对（TPU tb5b-a）
runs:
  test: tb5b-a
  golden: [gb3-a]
  root: /data/janus-runs
checks:
  - {id: L0.settings.lr, type: scalar_series, level: L0, select: {kind: metrics, field: lr, window: "1:1001"}, params: {equals: 1.0e-5, rtol: 0.0, abs_ulp: 0}}

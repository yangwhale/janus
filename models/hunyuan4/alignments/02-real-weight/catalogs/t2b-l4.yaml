# 混元 4 · T2 阶段 B：真实权重截层 B（第 0 层稠密 + 第 1 层 MoE，无 MTP） 的 L4 验收（事先登记：写于任何 T2 运行之前，PROTOCOL.md 变更记录）。
# 角色同 T1：GPU（Megatron，B200 × 8）是 golden / 基线，TPU（MaxText，v5p 2x2x2）是被测；TPU 配置 frameworks/maxtext/hy4-t2-b.yml
#（T1 现行数值与优化器开关原样，含台账 M28 的 ihc_stream_sum_unrolled），回放 gb2-a 写下的 batch 与 loss_mask。
# 噪声只用 GPU：同设置 8 份 gb2-a..h 两两 28 对，每个判定量取各对的最大值；TPU 第二份 tb2-b 只核逐位，不进尺子。
# 口径同 t1t-l4：grad_norm 以参照作分母（2026-11-10 起，原为两边均值）；param_norm 读更新之后参数范数的精确值（GPU param_norm_fp64，TPU param_norm_exact）。
# 窗口：第 1–300 步与第 101–300 步（loss）；可选的 1000 步另写目录，不改本文件。学习率在 t2b-l0-settings.yaml。
schema_version: 1
model: hunyuan4-trunc
stage: t2b-l4
description: T2 阶段 B L4，300 步（TPU tb2-a 被测，GPU gb2-a 为基线，GPU 噪声 28 对）
runs:
  test: tb2-a
  golden: [gb2-a]
  noise:
    - [gb2-a, gb2-b]
    - [gb2-a, gb2-c]
    - [gb2-a, gb2-d]
    - [gb2-a, gb2-e]
    - [gb2-a, gb2-f]
    - [gb2-a, gb2-g]
    - [gb2-a, gb2-h]
    - [gb2-b, gb2-c]
    - [gb2-b, gb2-d]
    - [gb2-b, gb2-e]
    - [gb2-b, gb2-f]
    - [gb2-b, gb2-g]
    - [gb2-b, gb2-h]
    - [gb2-c, gb2-d]
    - [gb2-c, gb2-e]
    - [gb2-c, gb2-f]
    - [gb2-c, gb2-g]
    - [gb2-c, gb2-h]
    - [gb2-d, gb2-e]
    - [gb2-d, gb2-f]
    - [gb2-d, gb2-g]
    - [gb2-d, gb2-h]
    - [gb2-e, gb2-f]
    - [gb2-e, gb2-g]
    - [gb2-e, gb2-h]
    - [gb2-f, gb2-g]
    - [gb2-f, gb2-h]
    - [gb2-g, gb2-h]
  root: /data/janus-runs
checks:
  - {id: L4.loss, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "1:301"}, params: {baseline: gb2-a}, threshold: calibrated}
  - {id: L4.loss.tail, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "101:301"}, params: {baseline: gb2-a}, threshold: calibrated}
  - {id: L4.indexer_loss, type: loss_series, level: L4, select: {kind: metrics, field: indexer_loss, window: "1:301"}, threshold: calibrated}
  - {id: L4.grad_norm, type: loss_series, level: L4, select: {kind: metrics, field: grad_norm, window: "1:301"}, threshold: calibrated}
  - {id: L4.param_norm, type: loss_series, level: L4, select: {kind: metrics, field: param_norm_fp64, test_field: param_norm_exact, window: "1:301"}, threshold: calibrated}
  - {id: L4.router.bias_mean, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_mean.", window: "1:301"}, threshold: calibrated}
  - {id: L4.router.bias_std, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_std.", window: "1:301"}, threshold: calibrated}

# 混元 4 · T2 B 1000 步：TPU tb5b-a（MaxText 2c28a4f4、janus 9c0f19a，T2 yml 当时的开关：M39–M41、M42 关、M42b 开、base2 开）被测，
# 回放 gb3-a；GPU gb3-a 为基线，噪声 gb3-a..h 两两 28 对。窗口与口径同 t2b5-l4.yaml（只改测试运行名，写于 tb5b-a 跑完之后）。
schema_version: 1
model: hunyuan4-trunc
stage: t2b5b-l4
description: T2 B L4，1000 步（TPU tb5b-a 被测，当时的开关含 M42b，GPU gb3-a 为基线，GPU 噪声 28 对）
runs:
  test: tb5b-a
  golden: [gb3-a]
  noise:
    - [gb3-a, gb3-b]
    - [gb3-a, gb3-c]
    - [gb3-a, gb3-d]
    - [gb3-a, gb3-e]
    - [gb3-a, gb3-f]
    - [gb3-a, gb3-g]
    - [gb3-a, gb3-h]
    - [gb3-b, gb3-c]
    - [gb3-b, gb3-d]
    - [gb3-b, gb3-e]
    - [gb3-b, gb3-f]
    - [gb3-b, gb3-g]
    - [gb3-b, gb3-h]
    - [gb3-c, gb3-d]
    - [gb3-c, gb3-e]
    - [gb3-c, gb3-f]
    - [gb3-c, gb3-g]
    - [gb3-c, gb3-h]
    - [gb3-d, gb3-e]
    - [gb3-d, gb3-f]
    - [gb3-d, gb3-g]
    - [gb3-d, gb3-h]
    - [gb3-e, gb3-f]
    - [gb3-e, gb3-g]
    - [gb3-e, gb3-h]
    - [gb3-f, gb3-g]
    - [gb3-f, gb3-h]
    - [gb3-g, gb3-h]
  root: /data/janus-runs
checks:
  - {id: L4.loss, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "1:1001"}, params: {baseline: gb3-a}, threshold: calibrated}
  - {id: L4.loss.tail, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "101:1001"}, params: {baseline: gb3-a}, threshold: calibrated}
  - {id: L4.indexer_loss, type: loss_series, level: L4, select: {kind: metrics, field: indexer_loss, window: "1:1001"}, threshold: calibrated}
  - {id: L4.grad_norm, type: loss_series, level: L4, select: {kind: metrics, field: grad_norm, window: "1:1001"}, threshold: calibrated}
  - {id: L4.param_norm, type: loss_series, level: L4, select: {kind: metrics, field: param_norm_fp64, test_field: param_norm_exact, window: "1:1001"}, threshold: calibrated}
  - {id: L4.router.bias_mean, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_mean.", window: "1:1001"}, threshold: calibrated}
  - {id: L4.router.bias_std, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_std.", window: "1:1001"}, threshold: calibrated}

# 混元 4 · T2 D1 1000 步设置核对，C 口径（TPU tdc-a，GPU gd3-a）：两边每一步学习率等于 1e-5。
# 同 t2d15b-l0-settings.yaml，只换被测（与 t2d1c-l4.yaml 同一对运行；写于 tdc-a 跑完之后补核）。
schema_version: 1
model: hunyuan4-trunc
stage: t2d1c-l0-settings
description: T2 D1 1000 步设置核对，C 口径（TPU tdc-a）
runs:
  test: tdc-a
  golden: [gd3-a]
  root: /data/janus-runs
checks:
  - {id: L0.settings.lr, type: scalar_series, level: L0, select: {kind: metrics, field: lr, window: "1:1001"}, params: {equals: 1.0e-5, rtol: 0.0, abs_ulp: 0}}

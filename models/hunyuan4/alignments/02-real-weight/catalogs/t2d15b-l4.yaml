# 混元 4 · T2 D1 1000 步：TPU td5b-b（MaxText 2c28a4f4、janus 9c0f19a，T2 yml 当时的开关：M39–M41、M42 关、M42b 开、base2 开）被测，
# 回放 gd3-a；GPU gd3-a 为基线，噪声 gd3-a..h 两两 28 对。窗口与口径同 t2d15-l4.yaml（只改测试运行名，写于 td5b-b 跑完之后）。
schema_version: 1
model: hunyuan4-trunc
stage: t2d15b-l4
description: T2 D1 L4，1000 步（TPU td5b-b 被测，当时的开关含 M42b，GPU gd3-a 为基线，GPU 噪声 28 对）
runs:
  test: td5b-b
  golden: [gd3-a]
  noise:
    - [gd3-a, gd3-b]
    - [gd3-a, gd3-c]
    - [gd3-a, gd3-d]
    - [gd3-a, gd3-e]
    - [gd3-a, gd3-f]
    - [gd3-a, gd3-g]
    - [gd3-a, gd3-h]
    - [gd3-b, gd3-c]
    - [gd3-b, gd3-d]
    - [gd3-b, gd3-e]
    - [gd3-b, gd3-f]
    - [gd3-b, gd3-g]
    - [gd3-b, gd3-h]
    - [gd3-c, gd3-d]
    - [gd3-c, gd3-e]
    - [gd3-c, gd3-f]
    - [gd3-c, gd3-g]
    - [gd3-c, gd3-h]
    - [gd3-d, gd3-e]
    - [gd3-d, gd3-f]
    - [gd3-d, gd3-g]
    - [gd3-d, gd3-h]
    - [gd3-e, gd3-f]
    - [gd3-e, gd3-g]
    - [gd3-e, gd3-h]
    - [gd3-f, gd3-g]
    - [gd3-f, gd3-h]
    - [gd3-g, gd3-h]
  root: /data/janus-runs
checks:
  - {id: L4.loss, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "1:1001"}, params: {baseline: gd3-a}, threshold: calibrated}
  - {id: L4.loss.tail, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "101:1001"}, params: {baseline: gd3-a}, threshold: calibrated}
  - {id: L4.mtp_loss, type: loss_series, level: L4, select: {kind: metrics, field: mtp_loss_mt, window: "1:1001"}, threshold: calibrated}
  - {id: L4.mtp_loss.tail, type: loss_series, level: L4, select: {kind: metrics, field: mtp_loss_mt, window: "101:1001"}, threshold: calibrated}
  - {id: L4.indexer_loss, type: loss_series, level: L4, select: {kind: metrics, field: indexer_loss, window: "1:1001"}, threshold: calibrated}
  - {id: L4.grad_norm, type: loss_series, level: L4, select: {kind: metrics, field: grad_norm, window: "1:1001"}, threshold: calibrated}
  - {id: L4.param_norm, type: loss_series, level: L4, select: {kind: metrics, field: param_norm_fp64, test_field: param_norm_exact, window: "1:1001"}, threshold: calibrated}
  - {id: L4.router.bias_mean, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_mean.", window: "1:1001"}, threshold: calibrated}
  - {id: L4.router.bias_std, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_std.", window: "1:1001"}, threshold: calibrated}

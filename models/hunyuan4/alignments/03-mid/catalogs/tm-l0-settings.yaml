# 混元 4 · hy4-mid 设置核对：两边每一步学习率等于登记的常数 1e-5（PROTOCOL.md 第 1.2 节），归 L0，不进 L4。事先登记。
schema_version: 1
model: hunyuan4-mid
stage: tm-l0-settings
description: hy4-mid 设置核对（逐步学习率等于登记的常数 1e-5，两边都要）
runs:
  test: tm-a
  golden: [gm-a]
  root: /data/janus-runs
checks:
  - {id: L0.settings.lr, type: scalar_series, level: L0, select: {kind: metrics, field: lr, window: "1:301"}, params: {equals: 1.0e-5, rtol: 0.0, abs_ulp: 0}}

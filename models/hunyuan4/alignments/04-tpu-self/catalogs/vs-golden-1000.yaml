# 混元 4 · TPU 自比：被测（跑 1000 步的臂）对 TPU golden ts-g-a 的 1000 步曲线；尺子 GPU g3-a … g3-p 两两 120 对（只当尺子）。检查同 vs-golden.yaml，窗口换成 1000 步。

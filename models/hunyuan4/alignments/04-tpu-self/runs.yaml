# 04 · TPU 自比（hy4-mini）· 运行清单。数据位置写成占位，不写桶名。
# 角色：golden 是一次确认过的 TPU 运行；被测是只改一样东西的 TPU 运行。GPU 只当尺子（自己重跑的波动上限）。
schema: 1
alignment: 04-tpu-self
golden:   # TPU golden
  - {name: ts-g-a, stage: T1, steps: 1000, role: "TPU 自比的 golden：base2 开的上一代对齐 yml（C 口径之前，M52、M58 不开）、MaxText b87a55aa、v5p 2x2x2、FSDP 8、微批 1 × 累积 2，回放 GPU g3-a；第 1 步全量抓数、训练步优化后 HLO", results: [ts-g-a.golden, ts-g-a-vs-gpu, ts-g-a-vs-gpu16], location: "gs://<POC 桶>/janus/hunyuan4/tpu/ts-g-a/"}
  - {name: ts-g52-a, stage: T1, steps: 1000, role: "libtpu 0.0.52 上的 golden（arms.yaml F5）：同 ts-g-a 的命令，Pod 里只把 libtpu 换成 0.0.52（运行目录 meta.json：v5p 2x2x2、libtpu==0.0.52、MaxText b87a55aa）；V 类各臂对它比", results: [ts-g52-a-vs-golden, ts-g52-a-vs-ts-g-a-1000], location: "gs://<POC 桶>/janus/hunyuan4/tpu/ts-g52-a/"}
  - {name: "<运行名>-1000（如 ts-g-a-1000、ts-g52-a-1000、ts-c-scar-1k-1000）", role: "不是另外的运行：<运行名>-1000 就是该运行的 1000 步窗口（ts-c-scar-1k-1000 是 ts-c-scar-1k 的 1000 步窗口；ts-c-scar-1k 是 C6 另跑的 1000 步运行，即 L11。F2b 的 1000 步对它比，目录 catalogs/vs-ts-c-scar-1k-1000.yaml）。arms.yaml 里 long_vs 写成这个名字，表示对它的 1000 步曲线比、尺子换成 GPU g3 16 份 120 对（catalogs/vs-golden-1000.yaml、vs-ts-g52-a-1000.yaml）；不写 long_vs 时默认 ts-g-a-1000"}
reference:   # 尺子与对照（不是被测）
  - {name: g2-a..g2-h, stage: T1, steps: 300, role: "曲线的尺子：GPU 同设置 8 份两两 28 对（catalogs/vs-golden.yaml）", location: "gs://<POC 桶>/janus/hunyuan4/gpu/g2-*/"}
  - {name: g3-a..g3-h, stage: T1, steps: 1000, role: "golden 对 GPU 的 1000 步比较（g3-a 是基线，28 对是噪声；catalogs/golden-vs-gpu.yaml）", results: [ts-g-a-vs-gpu], location: "gs://<POC 桶>/janus/hunyuan4/gpu/g3-*/"}
  - {name: g3-a..g3-p, stage: T1, steps: 1000, role: "v7x 1000 步（ts-h-v7-1k3）直接对 GPU 比的尺子：g3-a 基线，16 份两两 120 对（catalogs/v7x-1k-vs-gpu16.yaml；golden ts-g-a 用 --test 同尺子判一次作对照）", results: [ts-h-v7-1k3-vs-gpu16, ts-g-a-vs-gpu16], location: "gs://<POC 桶>/janus/hunyuan4/gpu/g3-*/"}
  - {name: g2s-a..g2s-c, stage: T1, steps: 1, role: "第 1 步梯度的尺子：GPU 三份两两（判档用）"}
  - {name: g2s-d..g2s-f, stage: T1, steps: 1, role: "第 1 步梯度 6 份重判多加的三份（与 g2s-a..c 共 6 份 15 对，01-mini 补的）：重判全部第 1 步结果，不改判档（setup「比较」）", results: [step1-n6-rejudge]}
  - {name: mini-fp64, role: "第 1 步梯度的 CPU FP64 参照（frameworks/megatron/step1_ref.py，同 01-mini）"}
test:     # TPU：对 golden 比
  - {name: ts-g-b, stage: T1, steps: 1000, role: "负对照：golden 在另一个切片上重跑，同一命令", golden: ts-g-a, results: [ts-g-b-vs-golden], location: "gs://<POC 桶>/janus/hunyuan4/tpu/ts-g-b/"}
  - {name: t1zg-b / mz-g1, stage: T1, steps: 1000, role: "旁证：同一 yml 的值、MaxText fd30fbfb（01-mini 的运行；mz-g1 多记逐头最大 logit）", golden: ts-g-a, results: [t1zg-b-vs-golden, mz-g1-vs-golden]}
  - {name: mz-opt2, stage: T1, steps: 1, role: "旁证：01-mini 第 1 步全量抓数（MaxText fd30fbfb），第 1 步训练梯度对 FP64 的正式结果来自它", golden: ts-g-a, results: [mz-opt2-vs-golden]}
  - {name: ts-pc-logits, stage: T1, steps: 300, role: "正对照：输出头矩阵乘降回默认精度（logits_matmul_precision=default）", golden: ts-g-a, results: [ts-pc-logits-vs-golden], location: "gs://<POC 桶>/janus/hunyuan4/tpu/ts-pc-logits/"}
  - {name: ts-pc-zm, stage: T1, steps: 300, role: "正对照：路由偏置改零均值更新（routed_bias_zero_mean_update=true），第 2 步起才改数值", golden: ts-g-a, results: [ts-pc-zm-vs-golden], location: "gs://<POC 桶>/janus/hunyuan4/tpu/ts-pc-zm/"}
  - {name: ts-c300, stage: T1, steps: 300, role: "阶段 0 校准：golden 同一命令跑 300 步（学习率恒定），核 300 步变种能不能直接对 golden 前 300 步比", golden: ts-g-a, results: [ts-c300-vs-golden], location: "gs://<POC 桶>/janus/hunyuan4/tpu/ts-c300/"}
  - {name: ts-dp8, stage: T1, steps: 300, role: "阶段 1 并行方式：纯数据并行 8（ici_data_parallelism=8、ici_fsdp_parallelism=1），其余同 golden", golden: ts-g-a, results: [ts-dp8-vs-golden], location: "gs://<POC 桶>/janus/hunyuan4/tpu/ts-dp8/"}
  - {name: ts-f16, stage: T1, steps: 300, role: "阶段 1 并行方式：v5p 2x2x4（16 个设备），FSDP 16、每设备微批 1、累积 1，全局批仍 16 × 4096", golden: ts-g-a, results: [ts-f16-vs-golden], location: "gs://<POC 桶>/janus/hunyuan4/tpu/ts-f16/"}
  - {name: "ts-*（其余各臂）", stage: T1, steps: "300 或 1000", role: "实验矩阵的各臂：运行名、对照、改法、场景在 arms.yaml，结果在 results/<运行名>-vs-<对照>.json；第 1 步全量抓数与训练步 HLO 在各运行目录", location: "gs://<POC 桶>/janus/hunyuan4/tpu/<运行名>/"}
  - {name: "ts52-*（V 类，libtpu 0.0.52）", stage: T1, steps: "300 或 1000", role: "libtpu 0.0.52 上的重测：Pod 里只把 libtpu 换成 0.0.52，其余同对应的 0.0.46 臂；对 0.0.52 的 golden ts-g52-a 或同版本的底比。运行名、对照、改法见 arms.yaml 的 V 段（V1–V21、V7b），结果在 results/<运行名>-vs-<对照>.json", location: "gs://<POC 桶>/janus/hunyuan4/tpu/<运行名>/"}
  - {name: "ts-n2-* / ts-n3-*（第 1 步消融）", stage: T1, steps: 1, role: "只抓第 1 步的消融，不判档、不进 arms.yaml。关省舍入那件（impacts/02）：ts-n2-ihcpk(-noexc)（iHC 走 Pallas 内核）、ts-n2-xfg(-noexc)（门控吃 FP32 的流，测试分支 486ac74e）、ts-n2-ihc-r1 / r2（cfb277dc / 983b4937）、ts-n2-hcdef(-noexc)、ts-n2-k1(-noexc)（b647e1e0：iHC 前半 Pallas、后半 XLA）、ts-n2-k2(-noexc)（b0bf5dc0：前半 XLA、后半 Pallas）、ts-n3-dlo-prodround（f4966773：开着省舍入，d layer_out 的每个乘积先舍 BF16 再累加）、ts-n2-dense-round、ts-n2-noexc-ga1、ts-n2-noexc-remall、ts-n2-noexc-hi。关小矩阵乘改写与 hc_head 那件（impacts/03、MATRIX「hc_head」，结果 night2-c15-norm-highest）：ts-n2-hi、ts-n2-nosrb-hi、ts-n2-v7-hi3、ts-n2-dein-noexc、ts-n3-d3final(-barrier)、ts-n3-d3nonfinal、ts-n3-d3-nomtploss、ts-n3-nomtploss。iHC 强制舍入那件（impacts/05，结果 night2-e8-ihc）：ts-n2-ihc-inA、ts-n2-ihc-stB、ts-n2-ihcr-noexc、ts-n2-ihcr-remall2、ts-n2-ihcr-kdl、ts-n2-kdl。上下文并行与 sink 那件（impacts/06，结果 night2-g-sink）：ts-n2-cp4、ts-n2-cp2f32w、ts-n2-cp2f32qk、ts-n2-dotw、ts-n2-dotf32w、ts-n2-dotf32qk、ts-n2-dot-ga1、ts-n2-dot-dp2f4。芯片与 libtpu 按各运行目录 meta.json（hardware、versions.libtpu_pip）核过：除 ts-n2-v7-hi3 是 v7x 2x2x1 外，全是 v5p 2x2x2，libtpu 全是 0.0.46；都是 8 个设备。切法：ts-n2-cp4 上下文并行 4，ts-n2-cp2f32w / ts-n2-cp2f32qk 上下文并行 2，ts-n2-dot-dp2f4 数据并行 2 × FSDP 4，其余 FSDP 8（切法按运行名与 impacts/06 正文，meta.json 只核了芯片与 libtpu）。部分运行的本地第 1 步抓数已删，数字沿用 a65c914 那一版（见结果文件 note）", results: [night2-noexcess-grad-sq], location: "gs://<POC 桶>/janus/hunyuan4/tpu/<运行名>/"}
  - {name: "fz52-g / fz52-r / fz52-d / fz46-g / fz46-r（同一份权重上的前向）", stage: T1, steps: "第 301–316 步，16 批", role: "RMSNorm 多舍一次那件（impacts/04「是前向的差」）：学习率 0、路由偏置更新率 0，用 --param-override 读 ts52-g-snapb（V18）第 301 步前存的 HF 快照，只算前向。-g 开 rmsnorm_single_rounding（单次舍入），-r 关（默认写法），-d 开单次舍入但最后一层强制两次（rmsnorm_final_rounding=double_strict）。fz52-* 用 libtpu 0.0.52，fz46-* 用 0.0.46：同一份 HF 快照、同一 MaxText 76ba907d，只换 libtpu。按运行目录 meta.json 核过：都是 v5p 2x2x2、FSDP 8", results: [rmsnorm052-evidence], location: "gs://<POC 桶>/janus/hunyuan4/tpu/<运行名>/"}
  - {name: "g2-a..g2-h / g3-a..g3-h（留一法）", stage: T1, role: "GPU 重跑的留一法 r 分布（analysis/gpu_loo_r.py），给「和 GPU 重跑分不开」的解读用", results: [gpu-rerun-loo-r-300, gpu-rerun-loo-r-1000]}

issues:
  dp:
    title: 纯数据并行
    file: impacts/01-data-parallel.md
    verdict: 不能忍
    fix: 开 `embedding_grad_fp32`、`embedding_grad_fp32_local_bf16_comm`，或只把词嵌入表沿数据并行轴切开的 `embedding_shard_over_data`
    fix_arms: [{arm: B1f, vs: B1}, {arm: B1h, vs: B1}, {arm: B1j, vs: B1}, {arm: B2g, vs: B2e}, {arm: V2, vs: V1}, {arm: V3, vs: V1}, {arm: V4, vs: V1}]
  excess:
    title: 关掉编译器的省舍入（excess precision）
    file: impacts/02-excess-precision.md
    verdict: 不能忍
    fix: 别关（默认开着）
    fix_arms: [{arm: golden, vs: C1}]
  smallmm:
    title: 关小矩阵乘改写
    file: impacts/03-small-matmul-rewrite.md
    verdict: 能忍
    fix: 别关（默认开着）
    fix_arms: [{arm: golden, vs: C15}]
  rms2:
    title: RMSNorm 多舍一次
    file: impacts/04-rmsnorm-double-rounding.md
    verdict: libtpu 0.0.46 上能忍；0.0.52 在 v5p FSDP 8 上不能忍（v7x 0.0.52 上略超、和 GPU 重跑分不开，V21）
    fix: 开着 `rmsnorm_single_rounding`（对齐、生产都要开）
    fix_arms: [{arm: golden, vs: E6}]
  ihc:
    title: iHC 不强制舍成 BF16
    file: impacts/05-ihc-bf16-rounding.md
    verdict: 能忍
    fix: 对齐时开着 `ihc_force_bf16_rounding`；生产不开
    fix_arms: [{arm: golden, vs: E8}]
  cp:
    title: 上下文并行
    file: impacts/06-context-parallel.md
    verdict: 能忍（判超是一个随求和顺序跳一倍的张量压线，按事先分类算规则误判）
    fix: MaxText `56492817` 起打开 `float32_logits`（上下文并行目前只能配普通注意力）
    fix_arms: [{arm: G4, vs: G2}]

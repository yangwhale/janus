# TPU 自比的每一次实验（知识库里叫「臂」：从基准运行 golden 出发只改一样东西的那次运行）：MATRIX.md 与 README 的结果表由 build_tables.py 按这里加 results/ 生成。
# 字段：id、run（运行名）、vs（对谁比，默认 ts-g-a）、change（改什么，知识库口径，可带开关名）、plain（给人看的说法，不带开关名）、
#       scenario（场景）、expect（预期）、fix（怎么固定，给人看）、note（不支持 / 待跑等，没有结果文件时显示）、
#       chips（芯片数，默认 8；算力代价按芯片·秒折算）、long（同一改动跑 1000 步的运行）、long_vs（它对谁比，默认 golden 的 1000 步）
#       libtpu（这次运行用的 libtpu 版本；不写 = golden 镜像自带的 0.0.46）、
#       kind（broken：故意改坏、用来证明工具抓得到；precision：动了精度的改动。S 类默认 broken）、
#       issue（和 GPU 重跑分得开时必填：归到下面 issues 里的哪一件）、group（逐位相同那张表的分组，默认按类：重跑与环境 / 代码写法 / 编译开关 / 版本）
#       screen（跑前离线筛的规格增量：对 vs 改了什么，写法见下面 screen_base 的说明）
# issues：README「真有影响」每件一行的文字（标题、详解文件、能不能忍、怎么修）；fix_arms 是修法对应的实验（arm）与修之前的那次（vs），golden 表示默认配置。数字一律由 build_tables.py 从 results/ 算；机制写在详解文件里
classes:
  A: 校准（按理不该变的）
  B: 并行与切分
  C: 编译开关
  D: 数学上等价的代码改写
  E: 会影响精度的真实改动
  F: 软件版本
  G: 上下文并行
  H: 硬件（v5p ↔ v7x）
  S: 灵敏度（故意埋的 bug 扫大小）
  L: 长跑（1000 步）
  V: libtpu 0.0.52 上重测（只换 libtpu，对 0.0.52 的 golden ts-g52-a 或同版本的底比；V16 是 v7x 0.0.46 → 0.0.52 的跨版本对比）
# 跑前离线筛（hlo_screen.py，用法见 setup.md「跑前离线筛」）：golden 的程序规格。每个臂的 screen 写它对自己的对照（vs）改了什么，
# 只写改了的项：args（MaxText key=value）、xla_flags、libtpu_args（追加）；maxtext、steps、platform、libtpu（替换）。screen: {} = 程序规格
# 与对照完全相同（换机器、换集群、重跑）。筛选结果在 results/hlo-screen.json，MATRIX.md 的「离线筛」一列与回测表由 build_tables.py 生成

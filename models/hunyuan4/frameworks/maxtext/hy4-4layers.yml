# 混元 4（Hy4-preview）截层：MaxText 训练配置，逐项对齐 GPU golden（GPU 侧训练程序与 golden 的 meta.json）。
# 现在的用途：不设 HY4_YML 时 mt_common 的默认配置——真实权重截层的转换、L0 核对与阶段 A 单算子回放用它。T1 用 hy4-mini-t1.yml。
# 结构：第 0 层稠密、1–3 层 MoE（256 专家 top-8 + 1 共享），indexer_types = full, full, shared, shared，MTP 1 层（自带 full indexer、无 iHC）。
# 这个文件写的是完整的「4 层 + MTP」；分阶段对齐（A：1 层；B：2 层；C：3 层；D：2 层 + MTP）由 mt_common.STAGES
# 在命令行覆盖 base_num_decoder_layers / mtp_num_layers（train_hy4.py --stage）。
# 逐项对照与证据见 models/hunyuan4/alignments/01-mini/config-alignment.md。要 maxtext 混元 4 集成分支（含 0b7dead5）
#（RoPE 去交错在转换时做：checkpoint_rope_interleave；精度开关与输出头矩阵精度也在这条分支上）。
#
# 每一行右边写 GPU 那一侧对应的值与出处。拿不准的写「待核对」，GPU meta.json 到了逐项填实。
base_config: "base.yml"                 # MaxText 自带的 base.yml（按 MAXTEXT_CONFIGS_DIR 找）

# ---- 模型：结构来自 hy4-preview.yml（与 HF config.json 同源），只截层数
model_name: "hy4-preview"
override_model_config: true
base_num_decoder_layers: 4              # GPU：截好的 HF config.json num_hidden_layers=4（阶段 A/B/C/D 再覆盖）
mtp_num_layers: 1                       # GPU：num_nextn_predict_layers=1（阶段 A/B/C 覆盖为 0）
dtype: "bfloat16"                       # GPU：BF16 计算（meta.dtypes.compute，待核对）
weight_dtype: "float32"                 # GPU：FP32 主权重（待核对 meta.dtypes）；MaxText 只存 FP32 主权重，计算时转 BF16
grad_dtype: "float32"                   # GPU：梯度 FP32 累加（待核对）
matmul_precision: "default"
dropout_rate: 0.0                       # GPU：无 dropout（hy4-preview.yml enable_dropout: false）
use_random_routing: false
load_balance_loss_weight: 0.0           # GPU：不加辅助负载均衡损失（待核对 meta）
z_loss_multiplier: 0.0
# 路由偏置（loss-free 负载均衡）：以 GPU golden 的 meta.json 为准；GPU 不更新时改 0
routed_bias_update_rate: 0.001          # 阶段 B 起的 GPU golden（gb-*）按无辅助损失的符号更新、更新率 1e-3（AdamW 时期的计划（见 git 历史） 3.5；DeepSeek-V3 的值，推断）：
                                        # b += rate·sign(平均负载 − 负载)，负载是整个全局 batch（含两个累积步）的计数，与 MaxText 同式。阶段 A 无 MoE，不起作用
# indexer：GPU golden 在 no_grad 下跑 indexer（不训练，AdamW 不管它 ⇒ 没有权重衰减）。
# TPU：indexer 损失权重 0（hy4-preview.yml 已是 0）；再用 trainable_parameters_mask 把 indexer 冻住
#（optax.multi_transform → set_to_zero，不分配 Adam 状态，不做权重衰减）。白名单是「路径里不含 indexer」的全部参数。
# 冻住只管更新；梯度本身要是 0 才不影响全局梯度范数（裁剪）——CPU 冒烟逐位确认 indexer 梯度为 0（smoke_checks）
indexer_loss_scaling_factor: 0.0
trainable_parameters_mask: ["^(?!.*indexer)"]
# MTP 损失权重：hy4-preview.yml 0.1（HF mtp_loss_factor）；GPU 待核对 meta

# ---- 舍入位置（从 hunyuan 分支移植的精度开关，默认全关）。下面的取值是按 HF 实现（transformers 5.22.1 hy_v4 + 项目定下的两处读法）
#      的写法推断的，**都是推断，由阶段 A 的 L1 单算子对 FP64 回放核定**（AdamW 时期的计划（见 git 历史） 4.11），核完改这里并在对照表记证据
dense_fp32_accumulation: true           # 推断：GPU 上 BF16 GEMM 由 cuBLAS FP32 累加、只舍一次；TPU FSDP 切开收缩维时不开会在 BF16 里累加分片部分积（混元 3 同理）
mlp_activation_round_per_op: true       # 推断：HF 稠密 MLP 与共享专家是 eager 的 act_fn(gate_proj(x)) * up_proj(x)，silu 输出与乘积各舍一次 BF16
rmsnorm_single_rounding: false          # 推断：HF HYV4RMSNorm 先转回 BF16 再乘权重（两次舍入），与 MaxText 默认写法相同（AdamW 时期的计划（见 git 历史） 4.11）
routed_gate_bf16_rounding: true         # 推断（阶段 B 起才有 MoE）：HF 路由 F.linear(h.float(), W.float())，W 本身是 BF16 = 「权重先舍 BF16、FP32 里乘」
rmsnorm_scale_grad_fp32: false
logits_dense_wgrad_fp32: false          # hy4-preview 的 logits_dot_in_fp32: true 下输出头本来以 FP32 计算，这个开关没有作用
embedding_grad_fp32: false
# 输出头矩阵精度（AdamW 时期的计划（见 git 历史） 4.6）：logits_dot_in_fp32 在默认矩阵精度下只是单遍 BF16（混元 3 实测），配 highest 才是真 FP32。
# GPU：输出头权重 FP32、logits FP32（ga1-a 的 dtypes_step1.json：hf.lm_head weight / out 都是 float32），dgrad 每 1024 个词一段 FP32 累加
logits_matmul_precision: "highest"

# ---- 优化器：GPU golden 是纯 PyTorch 循环的 AdamW（foreach 实现；不是 Megatron-Bridge，没有 scheduler 覆盖权重衰减的问题），
#      值按 GPU ga-b 的 meta.json config 读。PyTorch 先乘 (1 − lr·wd) 再减 Adam 步，optax 一次减 lr·(Adam 步 + wd·θ)：
#      代数相同，FP32 里的舍入顺序不同（已知差异，L3 第 1 步优化器状态里看）
opt_type: "adamw"
adam_b1: 0.9                            # GPU betas[0] 0.9
adam_b2: 0.95                           # GPU betas[1] 0.95
adam_eps: 1.0e-8                        # GPU eps 1e-8（PyTorch AdamW 加在 sqrt 外面，与 optax 一致）
adam_eps_root: 0.0
adam_weight_decay: 0.1                  # GPU meta.config.weight_decay_effective 0.1（ga-b）
adamw_mask: []                          # GPU：torch.optim.AdamW 对全部有梯度的参数一律 weight_decay 0.1（不分组：norm、sink、iHC、
                                        # embedding、输出头都衰减；AdamW 时期的 HF 训练程序（见 git 历史） 的 opt_s / opt_k），只有 indexer 梯度为 None 被跳过。
                                        # 和混元 3 不同（Megatron 不衰减 norm 与 bias）。indexer 在 TPU 上由 trainable_parameters_mask 冻住，不衰减
mu_dtype: "float32"
gradient_clipping_threshold: 1.0        # GPU clip_grad_norm_ 1.0
learning_rate: 1.0e-5                   # GPU lr 1e-5，常数
lr_schedule_type: "wsd"                 # 常数学习率：WSD 不预热、不衰减时只剩 optax.constant_schedule(lr)
warmup_steps_fraction: 0.0
wsd_decay_steps_fraction: 0.0
learning_rate_final_fraction: 1.0
skip_step_on_spikes: false

# ---- batch：8 个设备对 GPU 8 卡（v5p 2x2x2），每个设备 1 条 × 累积 2 次；设备 d 第 m 个累积步拿 GPU rank d 的 micro m（replay.py）
max_target_length: 4096
per_device_batch_size: 1
gradient_accumulation_steps: 2
init_weights_seed: 1234
data_shuffle_seed: 1234
ici_fsdp_parallelism: -1
ici_data_parallelism: 1
ici_tensor_parallelism: 1
ici_expert_parallelism: 1
dcn_data_parallelism: 1
megablox: true
sparse_matmul: true
capacity_factor: -1.0                   # 不丢 token（GPU dropless）

# ---- 重算：AdamW 时期的计划（见 git 历史） 2.2——TPU 一侧不拿重算当装下的手段（混元 3 实测：重算时 MoE 路由与前向不一致）。
#      本想用 save_everything（反向不重算任何前向算子），但它在 Hy4 上 trace 就报错（YaRN RoPE 的复数乘法 ×
#      everything_saveable：reduce_precision does not accept complex64；CPU hy4-tiny 与 v5p AOT 都复现，与精度开关无关）。
#      先用 custom、下面列出的全部命名张量存 HBM（与混元 3 的主配置同一做法）；没命名的中间量仍会在反向重算，
#      同一程序里重算的前向是同一段 HLO（混元 3 实测逐位相同），路由索引另由 moe_routing_maps: device 存下
remat_policy: "custom"
decoder_layer_input: "device"
context: "device"
query_proj: "device"
key_proj: "device"
value_proj: "device"
out_proj: "device"
query_wa_proj: "device"
kv_wa_proj: "device"
mla_q: "device"
mla_kv: "device"
attention_out: "device"
attention_gate: "device"
indexer_cutoff_threshold: "device"
mlpwi_0: "device"
mlpwi_1: "device"
mlpwo: "device"
moe_mlpwi_0: "device"
moe_mlpwi_1: "device"
moe_mlpwo: "device"
moe_out: "device"
moe_routing_maps: "device"
attention: "flash"                      # TPU splash（tokamax）；稀疏 indexer 走 flash 要 use_tokamax_splash（hy4-preview.yml 已开）
scan_layers: true                       # 分支的 IndexCache 块要求 scan_layers
enable_checkpointing: false
dataset_type: "synthetic"               # 不用 MaxText 的数据管线：train_hy4.py 按 golden 的 data/batches 原样回放
log_period: 1

  phase2-v7x-l2-replay-bwd-on-xnoise: "v7x 逐层反向按两侧执行噪声并集判的对照，同上，只报"
  phase2-st1-prod-state: "v5p 第 1 步整步更早的判法（GPU 3 对，被测是改配置前的 TPU 运行）；现行判法 `phase2-st1-on-state-gpuonly`"
  phase2-v7x-st1-prod-state: "v7x 第 1 步整步更早的判法，同上；现行判法 `phase2-v7x-st1-on-state-gpuonly`"
  phase2-st1-on-state-xnoise: "v5p 第 1 步整步按两侧执行噪声并集判的旧结果（2026-11-07 撤回：尺子只来自 GPU）；现行 `phase2-st1-on-state-gpuonly`，留作判法变更记录"

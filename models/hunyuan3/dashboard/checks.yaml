  phase2-acceptance-rcb-on: "v5p 对 `rcb-a` 的交叉核对，只报：正式第一层仍对 `rcc-a`（`phase2-acceptance-rcc-on`）"
  phase2-v7x-acceptance-rcb: "v7x 对 `rcb-a` 的交叉核对，只报：正式第一层仍对 `rcc-a`（`phase2-v7x-acceptance-rcc`）；grad_norm 的 MARE 1.09 倍待定，对 `rcc` 单份当 golden 时也在 0.70 – 1.11 之间起伏"
  phase2-l1-ops-own: "v5p 单算子，打开 `dense_fp32_accumulation` 之前的配置：qkv 与第 0 层 fc1 超线。被 `phase2-l1-ops-own-on` 取代"
  phase2-v7x-l1-ops-own: "v7x 单算子，打开 `dense_fp32_accumulation` 之前的配置。被 `phase2-v7x-l1-ops-own-on` 取代"
  phase2-l1-ops-wcoff: "v5p 单算子的诊断臂：整个关掉窗口化 collective matmul，用来定位 qkv 超线的来源（台账 #6）"
  phase2-l2-replay-rratio: "v5p 逐层前向，打开 `dense_fp32_accumulation` 之前：4 层都只差在 `attn.qkv.out`。被 `phase2-l2-replay-rratio-on` 取代"
  phase2-v7x-l2-replay-rratio: "v7x 逐层前向，打开 `dense_fp32_accumulation` 之前。被 `phase2-v7x-l2-replay-rratio-on` 取代"
  phase2-l2-replay-bwd-on: "v5p 逐层反向的旧判法：噪声只取 GPU 第 1 步重跑 3 对，这把尺子对路由翻转的宽度是 0。改按对 FP64 的 R 判（`phase2-l2-replay-bwd-fp64-on`）"

# 03 · 重算 golden 对不重算 golden：rc-a（整层重算 + 路由回放）对 g1k-a/b/c（不重算，其余设置相同），
# 噪声参照是 g1k 两两 3 对。超出噪声就说明「重算 + 回放」改了训练轨迹，不只是执行方式。
# rc-a..rc-c 各自对 g1k 的分段数字见 results/remat-offset.rc-*-vs-g1k.json。
schema_version: 1
model: hunyuan3-4l
stage: remat-vs-g1k
runs:
  test: rc-a
  golden: [g1k-a, g1k-b, g1k-c]
  noise:
    - [g1k-a, g1k-b]
    - [g1k-a, g1k-c]
    - [g1k-b, g1k-c]
  root: /data/rc/runs
checks:
  - id: L0.data.fingerprint
    type: data_fingerprint
    level: L0
    select: {kind: tokens, steps: "1:1001"}
    params: {first_loss: false}   # 只比 token：开重算后首步 loss 本来就不同（见 L3.step1.act.bitwise）
  - id: L3.step1.act.bitwise
    type: bitwise_equal
    level: L3
    hard: false              # 期望不逐位：重算下第一个 MoE 层的 probs 归一化顺序不同（见 remat-replay-base.yaml）
    select: {kind: tensor, step: 1, name: "*.out", exclude: "*.recompute"}
  - id: L4.loss
    type: multi_golden
    level: L4
    select: {kind: metrics, field: lm_loss, window: "1:1001"}
    threshold: calibrated
  - id: L4.grad_norm
    type: loss_series
    level: L4
    select: {kind: metrics, field: grad_norm, window: "1:1001"}
    threshold: calibrated
  - id: L4.param_norm
    type: loss_series
    level: L4
    select: {kind: metrics, field: param_norm, window: "1:1001"}
    threshold: calibrated
  - id: L4.router.bias_std
    type: router_stats
    level: L4
    select: {kind: metrics, prefix: "router.bias_std.", window: "1:1001"}
    threshold: calibrated

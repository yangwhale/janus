# 03 · 路由回放验证（二）：rv-det 对不开重算的确定性基线 d-a（00 的全量抓数运行）。
# 期望不逐位：开重算后首次前向在 no_grad 里跑，Megatron 的 top-k 在 no_grad 下不排序（sorted=torch.is_grad_enabled()），
# 第一个 MoE 层的 top-k 权重归一化求和顺序与建图前向不同，probs 差 1 ULP 量级，往后的层连带不同。
# 这几项记下「重算 + 回放」相对「不重算」改了多少，不是要求逐位。
schema_version: 1
model: hunyuan3-4l
stage: remat-replay-base
runs:
  test: rv-det
  golden: [d-a]
  root: /data/rc/runs
checks:
  - id: DET.replay.recompute_vs_baseline
    type: bitwise_equal
    level: L2
    hard: false
    select: {kind: tensor, step: 1, name: "*.recompute", ref_rename: {from: .recompute, to: ""}}
  - id: DET.replay.fwd_vs_baseline
    type: bitwise_equal
    level: L2
    hard: false
    select: {kind: tensor, step: 1, name: "layers.*", exclude: ["*.recompute", "*.grad", "*.counts"]}
  - id: DET.replay.grad_vs_baseline
    type: bitwise_equal
    level: L3
    hard: false
    select: {kind: tensor, step: 1, name: "grad.*"}
  - id: DET.replay.loss_vs_baseline
    type: loss_series
    level: L4
    hard: false
    select: {kind: metrics, field: lm_loss, window: "1:3"}
    threshold: exact

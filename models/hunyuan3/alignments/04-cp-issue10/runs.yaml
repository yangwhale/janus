  - {name: E1RG2, condition: E1, change: "CP2 Ring", series: results/series/E1RG2.json}
  - {name: E1RG2v, condition: E1, change: "CP2 Ring + 64 MiB", series: results/series/E1RG2v.json}
  - {name: E1RG2v40, condition: E1, change: "CP2 Ring + 40 MiB", series: results/series/E1RG2v40.json}
  - {name: E1RG2v56, condition: E1, change: "CP2 Ring + 56 MiB", series: results/series/E1RG2v56.json}
  - {name: E1RG2sa256, condition: E1, change: "CP2 Ring + splash 反向分块 256", series: results/series/E1RG2sa256.json}
  - {name: E1RG2nl, condition: E1, change: "CP2 Ring 关负载均衡", series: results/series/E1RG2nl.json}
  - {name: E1USP4, condition: E1, change: "FSDP 2 × Ring 2 × Ulysses 2 USP", series: results/series/E1USP4.json}
  - {name: E1USP4qkvf32, condition: E1, change: "USP + 诊断补丁（q/k/v 权重梯度留 FP32；第 1510 步被抢占收回，只有前 1510 步）", series: results/series/E1USP4qkvf32.json}

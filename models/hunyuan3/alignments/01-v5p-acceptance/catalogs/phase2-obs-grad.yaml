# 第二阶段 · 观测构建第三关的「第 1 步参数梯度」一条
#
# docs/reference/regression.md 第五节第三关：扰动臂第 1 步参数梯度对基线的 rel_L2，不大于 GPU 自己重跑的噪声上限（同一张量）。
# 被测 obs-t1：观测构建第 1 步图内抓到的梯度（加钩子的程序就是这条轨迹本身的程序）。
# 基线 t-st1-t1-gm：同提交、同 yml（7704115）、同覆盖的生产构建（不加钩子）跑 2 步，第 1 步训练前后状态读，梯度由一阶动量反推
#   （models/hunyuan3/analysis/grads_from_moments.py --src <运行根>/t-st1-t1 --out <运行根>/t-st1-t1-gm --steps 1）。
# 噪声参照：GPU 默认设置 g1k-a / b / c 两两 3 对的同名梯度（GPU 第 1 步只有 3 份全量抓数）。
# 另比更新后主权重与两个动量（同样都是状态读，第三关没规定，只报）。
schema_version: 1
model: hunyuan3-4l
stage: phase2-obs-grad
description: 观测构建第 1 步梯度对同提交生产构建（动量反推），GPU 3 对噪声
runs:
  test: obs-t1
  golden: [t-st1-t1-gm, g1k-a]
  noise:
    - [g1k-a, g1k-b]
    - [g1k-a, g1k-c]
    - [g1k-b, g1k-c]
  root: /data/janus-runs
checks:
  - {id: OBS.gate3.grads, type: tensor_tolerance, level: L3, select: {kind: tensor, step: 1, name: "grad.*"}, metrics: [rel_l2, cosine, norm_ratio], threshold: calibrated}
  - {id: OBS.updated, type: tensor_tolerance, level: L3, hard: false, select: {kind: tensor, step: 1, name: "main_param_after.*"}, metrics: [rel_l2, max_abs], threshold: calibrated}
  - {id: OBS.optim_state, type: tensor_tolerance, level: L3, hard: false, select: {kind: tensor, step: 1, name: "exp_avg*"}, metrics: [rel_l2, cosine], threshold: calibrated}

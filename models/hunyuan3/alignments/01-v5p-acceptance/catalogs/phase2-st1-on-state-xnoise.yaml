# 签字项 2b · 第 1 步状态读：噪声参照取 GPU 第 1 步重跑 3 对 ∪ TPU 第 1 步执行扰动 21 对
#
# 为什么：第 1 步 GPU 重跑路由从不翻转，GPU 3 对的上限对「路由近似平局在两种硬件上各落一边」的宽度是 0；
#   TPU 只改不影响数学的执行参数（splash 块 256 / 1024、scoped vmem 40 / 48 / 56 MiB 及其组合，同 rcc 系综与回归噪声臂），
#   第 1 步就会出现同类的差。被测对 GPU 的差不超过「任一侧只改执行方式就能差出的最大值」，就无法和执行噪声区分
#   （docs/reference/judging.md「第 1 步张量：两侧执行噪声的并集」）。
# TPU 七份：t-st1n-base-gm, t-st1n-sa256-gm, t-st1n-sa1k-gm, t-st1n-combo-gm, t-st1n-vmem40-gm, t-st1n-vmem56-gm, t-st1n-sa256v48-gm（当前对齐配置 yml a238883b，maxtext 0622774）。每份都 --no-hooks 跑 2 步、第 1 步全量状态读，梯度由 grads_from_moments.py 反推（-gm）。
schema_version: 1
model: hunyuan3-4l
stage: phase2-st1-on-state-xnoise
description: 第 1 步状态读 + 动量反推梯度（t-st1n-base 对 g1k-a），噪声 GPU 3 对 ∪ TPU 执行扰动 21 对
runs:
  test: t-st1n-base-gm
  golden: [g1k-a, g1k-b, g1k-c]
  noise:
    - [g1k-a, g1k-b]
    - [g1k-a, g1k-c]
    - [g1k-b, g1k-c]
    - [t-st1n-base-gm, t-st1n-sa256-gm]
    - [t-st1n-base-gm, t-st1n-sa1k-gm]
    - [t-st1n-base-gm, t-st1n-combo-gm]
    - [t-st1n-base-gm, t-st1n-vmem40-gm]
    - [t-st1n-base-gm, t-st1n-vmem56-gm]
    - [t-st1n-base-gm, t-st1n-sa256v48-gm]
    - [t-st1n-sa256-gm, t-st1n-sa1k-gm]
    - [t-st1n-sa256-gm, t-st1n-combo-gm]
    - [t-st1n-sa256-gm, t-st1n-vmem40-gm]
    - [t-st1n-sa256-gm, t-st1n-vmem56-gm]
    - [t-st1n-sa256-gm, t-st1n-sa256v48-gm]
    - [t-st1n-sa1k-gm, t-st1n-combo-gm]
    - [t-st1n-sa1k-gm, t-st1n-vmem40-gm]
    - [t-st1n-sa1k-gm, t-st1n-vmem56-gm]
    - [t-st1n-sa1k-gm, t-st1n-sa256v48-gm]
    - [t-st1n-combo-gm, t-st1n-vmem40-gm]
    - [t-st1n-combo-gm, t-st1n-vmem56-gm]
    - [t-st1n-combo-gm, t-st1n-sa256v48-gm]
    - [t-st1n-vmem40-gm, t-st1n-vmem56-gm]
    - [t-st1n-vmem40-gm, t-st1n-sa256v48-gm]
    - [t-st1n-vmem56-gm, t-st1n-sa256v48-gm]
  root: /data/janus-runs
checks:
  # ---------------- L1 优化器：FP64 重放一步 AdamW。梯度是从 m 反推的，所以 exp_avg 那一项按构造吻合；
  # 有信息量的是更新量（update.*，用 m、v、偏差修正、权重衰减、eps 重算）与 exp_avg_sq（v = (1 − β2)·ĝ²）
  - id: L1.optim.adamw.replay
    type: optimizer_step
    level: L1
    select: {kind: tensor, step: 1, name: "decoder.*"}
    params: {replay_from: test}
    metrics: [rel_l2, max_abs, cosine]
    threshold: {rel_l2: 5.0e-3}
    source: "沿用 phase1-full 的 L1.optim.adamw.replay：FP64 重放的更新量舍入到 FP32 后自身误差最大 1.79e-3，门槛取约 3 倍"
  # ---------------- L2 逐层参数梯度
  - id: L2.layer{i}.grads
    foreach: {i: [0, 1, 2, 3]}
    type: tensor_tolerance
    level: L2
    select: {kind: tensor, step: 1, name: "grad.decoder.layers.{i}.*"}
    metrics: [rel_l2, cosine, norm_ratio]
    threshold: calibrated
  # ---------------- L3 整网
  - id: L3.step1.grads.all
    type: tensor_tolerance
    level: L3
    select: {kind: tensor, step: 1, name: "grad.*"}
    metrics: [rel_l2, cosine, norm_ratio]
    threshold: calibrated
  - id: L3.step1.grads.dist
    type: tensor_tolerance
    level: L3
    select: {kind: tensor, step: 1, name: "grad.*"}
    metrics: [std_ratio, zero_frac_diff, rel_err_p99]
    threshold: calibrated
  - id: L3.step1.updated
    type: tensor_tolerance
    level: L3
    select: {kind: tensor, step: 1, name: "main_param_after.*"}
    metrics: [rel_l2, max_abs, cosine]
    threshold: calibrated
  - id: L3.step1.optim_state
    type: tensor_tolerance
    level: L3
    select: {kind: tensor, step: 1, name: "exp_avg*"}
    metrics: [rel_l2, cosine]
    threshold: calibrated
  - id: L3.step1.fake_fp32.main_param
    type: fake_fp32
    level: L3
    select: {kind: tensor, step: 1, name: "main_param_after.*"}
  - id: L3.step1.fake_fp32.optim_state
    type: fake_fp32
    level: L3
    select: {kind: tensor, step: 1, name: "exp_avg*"}
  - id: L3.step1.bias_after
    type: tensor_tolerance
    level: L3
    select: {kind: tensor, step: 1, name: "buffer_after.*"}
    metrics: [rel_l2, max_abs]
    threshold: calibrated

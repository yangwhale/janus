# 第二阶段 · 正式迁移验收（第一层，必须过）：TPU v5p 当前对齐配置对最终 golden rcc-a
#
#   rcc = GPU 生产程序（rc：BF16 混合精度、整层重算 + 路由回放）+ 输出头 dgrad 分段 FP32 累加（rr_arms.py `dgrad-chunk`）。
#   它是最终 golden（2026-11-06 定）：GPU 生产只修掉输出头 dgrad 那一次长累加的系统偏差（BF16 张量核截断、cuBLAS FP32 一次累加都有偏），
#   其余全是生产程序本身。逐项改动与机制见 models/hunyuan3/goldens.md，整体结论见 ALIGNMENT-REPORT.md。
# 尺子：正式比较只对 rcc-a；噪声带是 rcc-a..j 两两 45 对（同设置原样重跑，GPU 生产程序本身不确定），与被测同一种设置——一般规矩，没有例外。
#   起初只有 a..e 10 对；那时 v5p / v7x 有几项落在 1–1.3 倍之间，再跑 f..j 把参照加到 45 对（10 对时的读数见案例 01「rcc 的散布」附录）。
# L4.param_norm 的被测读派生列 param_norm_from_groups（分组平方和 FP64 相加后开方）：TPU 记的 param_norm 是整网一次 FP32 归约，
#   单步测量误差到 1e-7 量级、和噪声上限同量级（案例 01「param_norm 的测量精度」行）；原始列的结果留在 L4.param_norm.raw（只报）。
# L4.grad_norm 用 denominator: mean（两边均值作分母）：grad_norm 逐步相对涨落约 ±3%，以 golden 为分母时带符号均值有 +E[δ²] ≈ 1e-3 的偏置，
#   a..e 10 对按 a~b 与 b~a 列，N 差一倍（1.26e-3 对 2.49e-3），N 取决于列表顺序；均值分母下交换两边只差符号（docs/reference/judging.md）。
#   以 golden 为分母的结果留在 L4.grad_norm.golden_den（只报）。
# 被测：t-rmap-on-1000。
# 运行根：rcc-a..j 与被测的 meta.json / metrics.jsonl / DONE 放同一个目录（gs://<桶>/janus/hunyuan3-4l/golden/…、…/tpu/…）。
schema_version: 1
model: hunyuan3-4l
stage: phase2-acceptance-rcc-on
description: 正式迁移验收第一层（v5p t-rmap-on-1000 对最终 golden rcc-a，噪声 rcc-a..j 10 份两两 45 对）
runs:
  test: t-rmap-on-1000
  golden: [rcc-a]
  noise:
    - [rcc-a, rcc-b]
    - [rcc-a, rcc-c]
    - [rcc-a, rcc-d]
    - [rcc-a, rcc-e]
    - [rcc-a, rcc-f]
    - [rcc-a, rcc-g]
    - [rcc-a, rcc-h]
    - [rcc-a, rcc-i]
    - [rcc-a, rcc-j]
    - [rcc-b, rcc-c]
    - [rcc-b, rcc-d]
    - [rcc-b, rcc-e]
    - [rcc-b, rcc-f]
    - [rcc-b, rcc-g]
    - [rcc-b, rcc-h]
    - [rcc-b, rcc-i]
    - [rcc-b, rcc-j]
    - [rcc-c, rcc-d]
    - [rcc-c, rcc-e]
    - [rcc-c, rcc-f]
    - [rcc-c, rcc-g]
    - [rcc-c, rcc-h]
    - [rcc-c, rcc-i]
    - [rcc-c, rcc-j]
    - [rcc-d, rcc-e]
    - [rcc-d, rcc-f]
    - [rcc-d, rcc-g]
    - [rcc-d, rcc-h]
    - [rcc-d, rcc-i]
    - [rcc-d, rcc-j]
    - [rcc-e, rcc-f]
    - [rcc-e, rcc-g]
    - [rcc-e, rcc-h]
    - [rcc-e, rcc-i]
    - [rcc-e, rcc-j]
    - [rcc-f, rcc-g]
    - [rcc-f, rcc-h]
    - [rcc-f, rcc-i]
    - [rcc-f, rcc-j]
    - [rcc-g, rcc-h]
    - [rcc-g, rcc-i]
    - [rcc-g, rcc-j]
    - [rcc-h, rcc-i]
    - [rcc-h, rcc-j]
    - [rcc-i, rcc-j]
  root: /data/janus-runs
checks:
  - {id: L4.loss, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "1:1001"}, params: {baseline: rcc-a, signed_mean_se_k: 2}, threshold: calibrated}
  - {id: L4.loss.tail, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "301:1001"}, params: {baseline: rcc-a, signed_mean_se_k: 2}, threshold: calibrated}
  - {id: L4.grad_norm, type: loss_series, level: L4, select: {kind: metrics, field: grad_norm, window: "1:1001"}, params: {denominator: mean}, threshold: calibrated}
  - {id: L4.grad_norm.golden_den, type: loss_series, level: L4, hard: false, select: {kind: metrics, field: grad_norm, window: "1:1001"}, threshold: calibrated}
  - {id: L4.param_norm, type: loss_series, level: L4, select: {kind: metrics, field: param_norm, test_field: param_norm_from_groups, window: "1:1001"}, threshold: calibrated}
  - {id: L4.param_norm.raw, type: loss_series, level: L4, hard: false, select: {kind: metrics, field: param_norm, window: "1:1001"}, threshold: calibrated}
  - {id: L4.lr, type: scalar_series, level: L4, select: {kind: metrics, field: lr, window: "1:1001"}, params: {rtol: 0.0, abs_ulp: 0}}

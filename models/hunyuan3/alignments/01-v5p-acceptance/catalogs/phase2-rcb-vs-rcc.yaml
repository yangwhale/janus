# 第二阶段 · 便宜的等价修法：rcb-a 对最终 golden rcc-a
#
#   rcb = rcc 的设置（GPU 生产程序 rc：BF16 混合精度、整层重算 + 路由回放；同一种子、数据、batch）只把输出头 dgrad 的臂
#   从 dgrad-chunk（升 FP32、词表按 1024 分段、段间 FP32 累加）换成 dgrad-chunk-bf16（不升精度：每段 BF16 张量核乘法、输出 FP32，
#   段间 FP32 累加，舍回 BF16）。依据：离线消融里去掉偏差的是分段而不是 FP32（案例 01「输出头 dgrad 消融：分段还是 FP32」行）。
# 问题：rcb 和 rcc 在 1000 步上分不分得开。尺子与正式第一层相同：对 rcc-a，噪声 rcc-a..j 两两 45 对。
#   rcb-a 是 GPU 运行，param_norm 两边读同一列（不用 TPU 那边的分组合成值）。
#   另加路由偏置标准差曲线（router.bias_std.1..3）与健康信号，同 phase2-acc-health-rcc.yaml。
# 被测：rcb-a（rcb-b 与对照 rcc-chk 用 --test 换被测，读数见案例 01 注 42）。正式基线仍是 rcc-a，本目录不改基线。
schema_version: 1
model: hunyuan3-4l
stage: phase2-rcb-vs-rcc
description: 便宜的等价修法（rcb-a：输出头 dgrad 用 BF16 张量核分段）对最终 golden rcc-a，噪声 rcc-a..j 10 份两两 45 对
runs:
  test: rcb-a
  golden: [rcc-a]
  noise:
    - [rcc-a, rcc-b]
    - [rcc-a, rcc-c]
    - [rcc-a, rcc-d]
    - [rcc-a, rcc-e]
    - [rcc-a, rcc-f]
    - [rcc-a, rcc-g]
    - [rcc-a, rcc-h]
    - [rcc-a, rcc-i]
    - [rcc-a, rcc-j]
    - [rcc-b, rcc-c]
    - [rcc-b, rcc-d]
    - [rcc-b, rcc-e]
    - [rcc-b, rcc-f]
    - [rcc-b, rcc-g]
    - [rcc-b, rcc-h]
    - [rcc-b, rcc-i]
    - [rcc-b, rcc-j]
    - [rcc-c, rcc-d]
    - [rcc-c, rcc-e]
    - [rcc-c, rcc-f]
    - [rcc-c, rcc-g]
    - [rcc-c, rcc-h]
    - [rcc-c, rcc-i]
    - [rcc-c, rcc-j]
    - [rcc-d, rcc-e]
    - [rcc-d, rcc-f]
    - [rcc-d, rcc-g]
    - [rcc-d, rcc-h]
    - [rcc-d, rcc-i]
    - [rcc-d, rcc-j]
    - [rcc-e, rcc-f]
    - [rcc-e, rcc-g]
    - [rcc-e, rcc-h]
    - [rcc-e, rcc-i]
    - [rcc-e, rcc-j]
    - [rcc-f, rcc-g]
    - [rcc-f, rcc-h]
    - [rcc-f, rcc-i]
    - [rcc-f, rcc-j]
    - [rcc-g, rcc-h]
    - [rcc-g, rcc-i]
    - [rcc-g, rcc-j]
    - [rcc-h, rcc-i]
    - [rcc-h, rcc-j]
    - [rcc-i, rcc-j]
  root: /data/janus-runs
checks:
  - {id: L4.loss, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "1:1001"}, params: {baseline: rcc-a, signed_mean_se_k: 2}, threshold: calibrated}
  - {id: L4.loss.tail, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "301:1001"}, params: {baseline: rcc-a, signed_mean_se_k: 2}, threshold: calibrated}
  - {id: L4.grad_norm, type: loss_series, level: L4, select: {kind: metrics, field: grad_norm, window: "1:1001"}, params: {denominator: mean}, threshold: calibrated}
  - {id: L4.grad_norm.golden_den, type: loss_series, level: L4, hard: false, select: {kind: metrics, field: grad_norm, window: "1:1001"}, threshold: calibrated}
  - {id: L4.param_norm, type: loss_series, level: L4, select: {kind: metrics, field: param_norm, window: "1:1001"}, threshold: calibrated}
  - {id: L4.lr, type: scalar_series, level: L4, select: {kind: metrics, field: lr, window: "1:1001"}, params: {rtol: 0.0, abs_ulp: 0}}
  - {id: L4.router.bias_std, type: router_stats, level: L4, select: {kind: metrics, prefix: "router.bias_std.", window: "1:1001"}, threshold: calibrated}
  - id: L4.health
    type: health_signals
    level: L4
    select: {kind: metrics, fields: [lm_loss, grad_norm, param_norm]}
    params: {window: 10, spike_ratio: 3, source: "推断：沿用 phase1-full（常数学习率下单步超前 10 步中位数 3 倍即异常）"}

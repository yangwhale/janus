# 01 · B200×8 → TPU v5p-8 · 运行清单。数据位置写成占位，不写桶名。
# 字段出处：各运行目录的 meta.json；golden 的完整参数见 ../../frameworks/megatron/README.md「第一阶段每次运行的参数」。
schema: 1
alignment: 01-v5p-acceptance
golden:
  - name: g1k-a
    steps: 1000
    setting: 默认（非确定性），不开分布式优化器
    dump: --dump-steps 1,1000 --full
    code: {framework: "nemo:26.10 容器自带 Megatron-Bridge；train_hy3.py sha256 4e41f0ae455c60bda6113ae97c8afb0cba7412d8fdb5a86560f6f23daed62815", janus: 未记录, image: nvcr.io/nvidia/nemo:26.10}
    location: gs://<POC 桶>/janus/hunyuan3-4l/golden/g1k-a/
  - name: g1k-b
    steps: 1000
    setting: 同 g1k-a
    location: gs://<POC 桶>/janus/hunyuan3-4l/golden/g1k-b/
  - name: g1k-c
    steps: 1000
    setting: 同 g1k-a
    location: gs://<POC 桶>/janus/hunyuan3-4l/golden/g1k-c/
  - name: g1k-det
    steps: 1000
    setting: 确定性；不和默认设置混作噪声参照
    location: gs://<POC 桶>/janus/hunyuan3-4l/golden/g1k-det/
test:
  - name: hy3-4l-maxtext-ckpt
    role: L0 权重转换核对（只有参数清单，CPU 上由 model/verify_ckpt.py 写出）
    golden: hy3-4l-hf
    results: phase2-ckpt-convert
  - name: t-loss30
    steps: 30
    role: 被测（只看 loss，不加钩子、不抓数）
    setting: "--no-hooks --dump-steps none --no-param-sha；FSDP 8；topology 2x2x2"
    code: {framework: maxtext@64cd9a640b8ea65aaf856b6f24755f61ee97e057, janus: 16af8f7b116b337fae03265c26bf0ba7256c6fc7, image: "tpu_pre_training@sha256:b152355a1425c28e99841c014703495059705de1733df8ac837ba43b4fe52fcf"}
    config: {file: frameworks/maxtext/hy3-4layers.yml, sha256: 66a03bf31d3578d9d1d5bcfb0103f5047572df5c802f0057f0683ef315ae435f, overrides: [mtp_num_layers=0]}
    location: gs://<POC 桶>/janus/hunyuan3-4l/tpu/t-loss30/
    series: results/series/t-loss30.metrics.jsonl
    results: phase2-t-loss30
  - name: t-a
    steps: 1000
    role: 被测（第 1 步全量抓数）
    setting: yml 66a03bf31d35…（per_device_batch_size 2、GA 1，不开精度开关；见 setup.md「训练配置版本」表），第 1、1000 步全量抓数；提交号见运行目录的 meta.json
    location: gs://<POC 桶>/janus/hunyuan3-4l/tpu/t-a/
    results: [phase2-t-a-coverage]

# 对齐实践 02 · 第 1 步激活逐位（只报）：v7x 逐层隔离回放 r-v7x-l2 的各观测点对 golden。照 01 的 phase2-l2-replay-bitwise.yaml 复制。
# r-v7x-l2：layer_replay.py --layers 0,1,2,3 --grad，maxtext 237a3270 + janus 68ae6b89（生产 yml，三个精度开关打开；
#   01 的 r-l2-norm-perop 用的是更早的提交、命令行打开两个开关，第三个开关在第 1 步不起作用），v7x 2x2x1。
schema_version: 1
model: hunyuan3-4l
stage: phase2-v7x-l2-replay-bitwise
description: 第 1 步逐层隔离回放的激活对 golden 逐位（只报）
runs:
  test: r-v7x-l2
  golden: [g1k-a]
  root: /data/janus-runs
checks:
  - id: L3.step1.act.bitwise
    type: bitwise_equal
    level: L3
    hard: false
    select: {kind: tensor, step: 1, name: "layers.*.out", exclude: "*.routed.out"}     # routed.out 只有 TPU 有（GPU 只有分发缓冲区）

# 【状态（2026-11-06）】本目录是第二层：对 GPU 生产 golden rc 的差写成已解释差异（ALIGNMENT-REPORT 第 3 节），不是第一层；第一层是 phase2-v7x-acceptance-rcc.yaml。
# 对齐实践 02 · 正式迁移验收（第二层，对生产 golden）：TPU v7x 生产配置对 GPU 整层重算 + 路由回放 golden rc-a..rc-e
# 照 01 的 phase2-acceptance-rc.yaml 复制，只换被测：t-v7x-rmap-1000-a（与 01 的 t-rmap-1000 同一份代码包、同一份 yml 与命令行覆盖：
#   GA 2 + 三个精度开关；除层输入与 moe_routing_maps 外全部 remat，moe_routing_maps=device），v7x 2x2x1（4 片 8 device）。
# 01 的结论：v5p 对 rc 不通过，差异来自 GPU 输出层 dgrad 在 BF16 张量核里朝 0 截断（../../01-v5p-acceptance/cases/01-loss-offset-param-norm.md 第 7 节），记为已解释差异。
#   这里看 v7x 是不是同样偏离 rc（同号、同量级）。
# 运行根：rc-{a..e} 的 meta.json / metrics.jsonl / DONE 与 t-v7x-rmap-1000-a 放同一个目录（janus run --root）。
schema_version: 1
model: hunyuan3-4l
stage: phase2-v7x-acceptance-rc
description: （第二层）02 正式迁移验收（v7x 生产配置 t-v7x-rmap-1000-a 对 GPU rc-a..rc-e）
runs:
  test: t-v7x-rmap-1000-a
  golden: [rc-a, rc-b, rc-c, rc-d, rc-e]
  noise:
    - [rc-a, rc-b]
    - [rc-a, rc-c]
    - [rc-a, rc-d]
    - [rc-a, rc-e]
    - [rc-b, rc-c]
    - [rc-b, rc-d]
    - [rc-b, rc-e]
    - [rc-c, rc-d]
    - [rc-c, rc-e]
    - [rc-d, rc-e]
  root: /data/janus-runs
checks:
  - {id: L4.loss, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "1:1001"}, params: {baseline: rc-a, signed_mean_se_k: 2}, threshold: calibrated}
  - {id: L4.loss.tail, type: multi_golden, level: L4, select: {kind: metrics, field: lm_loss, window: "301:1001"}, params: {baseline: rc-a, signed_mean_se_k: 2}, threshold: calibrated}
  - {id: L4.grad_norm, type: loss_series, level: L4, select: {kind: metrics, field: grad_norm, window: "1:1001"}, threshold: calibrated}
  - {id: L4.param_norm, type: loss_series, level: L4, select: {kind: metrics, field: param_norm, window: "1:1001"}, threshold: calibrated}
  - {id: L4.lr, type: scalar_series, level: L4, select: {kind: metrics, field: lr, window: "1:1001"}, params: {rtol: 0.0, abs_ulp: 0}}

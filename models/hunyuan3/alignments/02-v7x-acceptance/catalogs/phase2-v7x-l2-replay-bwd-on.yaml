# 被测 r-v7x-l2-on（对齐配置 yml a238883…，dense_fp32_accumulation 打开；此前的 r-v7x-l2 见 phase2-v7x-l2-replay-bwd.yaml）。
# 对齐实践 02 · L2 逐层反向：v7x 逐层隔离回放 r-v7x-l2 的输入梯度对 golden。照 01 的 phase2-l2-replay-bwd.yaml 复制（被测说明见 phase2-v7x-l2-replay-bitwise.yaml）。
schema_version: 1
model: hunyuan3-4l
stage: phase2-v7x-l2-replay-bwd-on
description: L2 逐层隔离回放的反向（layers.k.in.grad）对 golden，GPU 噪声参照 3 对
runs:
  test: r-v7x-l2-on
  golden: [g1k-a, g1k-b, g1k-c]
  noise:
    - [g1k-a, g1k-b]
    - [g1k-a, g1k-c]
    - [g1k-b, g1k-c]
  root: /data/janus-runs
checks:
  - id: L2.layer{i}.bwd
    foreach: {i: [0, 1, 2, 3]}
    type: tensor_tolerance
    level: L2
    select: {kind: tensor, step: 1, name: "layers.{i}.in.grad"}
    metrics: [rel_l2, cosine, norm_ratio]
    threshold: calibrated

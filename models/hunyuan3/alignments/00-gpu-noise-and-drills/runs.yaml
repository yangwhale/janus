# 00 · B200×8 自比 · 运行清单（按批次列；每次运行的完整参数见 ../../frameworks/megatron/README.md「第一阶段每次运行的参数」）
# 运行目录在 POC Pod 的 /data/janus-runs/、/data/janus-runs2/（不对外）；GPU golden g1k-* 另有一份在 gs://<POC 桶>/janus/hunyuan3-4l/golden/。
schema: 1
alignment: 00-gpu-noise-and-drills
code: {framework: "nemo:26.10 容器自带 Megatron-Bridge", janus: 未逐次记录, image: nvcr.io/nvidia/nemo:26.10}
batches:
  - name: 噪声底
    runs: [rd-golden-1, rd-det-b, rd-golden-2, rd-golden-3, rd-golden-4, rd-golden-5]
    steps: 1000
    setting: rd-golden-1 / rd-det-b 确定性，其余默认；分布式优化器开（推断，见 README 第 6 条）
    results: [phase1-noise, phase1-determinism]
  - name: 全量抓数 golden（也是 01 / 02 的 golden；不重算，现在是归因参照，生产近似 golden 是 03 的 rc-*）
    runs: [g1k-a, g1k-b, g1k-c, g1k-det]
    steps: 1000
    setting: g1k-a/b/c 默认，g1k-det 确定性；分布式优化器关；--dump-steps 1,1000 --full
    series: [results/series/g1k-a.metrics.jsonl, results/series/g1k-b.metrics.jsonl, results/series/g1k-c.metrics.jsonl, results/series/g1k-det.metrics.jsonl]
  - name: 全覆盖
    runs: [s-a, s-b, s-c, s-d, s-e, s-f, s-g, s-h, s-i, d-a, d-b]
    steps: 100
    setting: s-* 默认，d-* 确定性；--dump-steps 1,100 --full
    results: [phase1-full, phase1-noise15, phase1-full-noise28]
  - name: 故障演练
    runs: [f-weight, f-weight2, f-data, f-router, f-lr, f-drop, f-grad, f-gscale, f-bias, f-nan, f-spike, i-weight]
    setting: 确定性基线 d-a 上埋一个错
    results: [phase1-inject, phase1-nan, phase1-spike]
    matrix: faults/phase1-faults.md
  - name: 只换执行方式
    runs: [p-ep4, p-ep4f, p-tp2, p-cp2, p-mbs2, r-remat, r-cont, r-resume, t-2l, h-light2, m-opt8]
    setting: 确定性；各改一项（见运行参数表）
    results: [phase1-parallel, phase1-parallel-ext, phase1-tp-cp.tp2, phase1-tp-cp.cp2, phase1-ga, phase1-remat, phase1-resume, phase1-truncate, phase1-hooks, phase1-opt8]
  - name: GPU 侧剩余检查
    runs: [g61-obs, g61-notf32, g61-sv-save, g61-sv-load]
    results: [phase1-obs, phase1-kernels, phase1-tf32, phase1-moe-stages, phase1-causal-model, phase1-ckpt-special]

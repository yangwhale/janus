# 第一阶段 · GPU 噪声底：三份 golden（golden-1 确定性，golden-2/3 默认设置）两两相比
# 说明：这里被测 golden-3 也出现在噪声参照里，只用来演示整条链与量出噪声底；第二阶段被测换成 TPU。
schema_version: 1
model: hunyuan3-4l
stage: phase1-noise
runs:
  test: rd-golden-3
  golden: [rd-golden-1, rd-golden-2]
  noise:
    - [rd-golden-1, rd-golden-2]
    - [rd-golden-1, rd-golden-3]
    - [rd-golden-2, rd-golden-3]
  root: /data/janus-runs
checks:
  - id: L4.loss
    type: multi_golden
    level: L4
    select: {kind: metrics, field: lm_loss, window: "1:1001"}
    threshold: calibrated
  - id: L4.lr
    type: scalar_series
    level: L4
    select: {kind: metrics, field: lr, window: "1:1001"}
  - id: L3.step1.act
    type: tensor_tolerance
    level: L3
    metrics: [rel_l2, cosine, max_abs]
    select: {kind: tensor, step: 1, name: "*.out"}
    threshold: calibrated
  - id: L3.step1.ulp
    type: ulp_distribution
    level: L3
    hard: false
    select: {kind: tensor, step: 1, name: "*.out"}
    threshold: calibrated
  - id: L4.step1000.act
    type: tensor_tolerance
    level: L4
    metrics: [rel_l2, cosine, max_abs]
    select: {kind: tensor, step: 1000, name: "*.out"}
    threshold: calibrated
  - id: L4.step1000.router
    type: discrete_agreement
    level: L4
    select: {kind: tensor, step: 1000, name: "*.router.topk_idx"}
    threshold: calibrated
    params: {mode: topk}

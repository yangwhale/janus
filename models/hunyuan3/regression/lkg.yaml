# 数值没变（回归门逐位通过）：指针前移，追加一条，approved_by 写「逐位，无需批准」。
# 数值变了（会改数值、升级依赖）：由项目负责人批准后追加，附 PR 号与声明、回归门各行的变化、对齐门「不变差」、（升级依赖）归因结论。

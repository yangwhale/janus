# 混元 3 · 日常回归 · T1 主力：4 层，主切分，1000 步（= golden 长度），不抓张量。
# T0 的全部行（regression-common.yaml，步数与窗口换成 1000 步）+ R12、R13、R16①、R25（标准第六节）。
# R25 要修好的 golden rcc-a..rcc-j 的 meta.json 与 metrics.jsonl（run_regression.sh 取回）。
schema_version: 1
model: hunyuan3-4l
stage: regression-t1
description: T1 主力（1000 步）对 LKG，R25 对修好的 golden rcc-a（噪声 rcc-a..j 45 对）
runs:
  root: /data/janus-runs
  test: TEST_RUN
  lkg: LKG_RUN
  golden: [rcc-a, rcc-b, rcc-c, rcc-d, rcc-e, rcc-f, rcc-g, rcc-h, rcc-i, rcc-j]
  # 容差门（role: tolerance）的噪声参照：TPU 执行噪声，基线 + 过了三关的扰动臂两两成对（28 对，正式；README 第五节）。
  # 必须和 ../calibration.yaml 里 v5p / T1 最新一条的 pairs 相同（tests 核）；运行目录由 run_regression.sh 按那里的位置取回
  noise:
    - [sync0119-t1-a, s19-vmem64-t1]
    - [sync0119-t1-a, s19-vmem48-t1]
    - [sync0119-t1-a, s19-vmem40-t1]
    - [sync0119-t1-a, s19-vmem56-t1]
    - [sync0119-t1-a, s19-sabwd1k-t1]
    - [sync0119-t1-a, s19-sabwd256-t1]
    - [sync0119-t1-a, s19-combo-t1]
    - [s19-vmem64-t1, s19-vmem48-t1]
    - [s19-vmem64-t1, s19-vmem40-t1]
    - [s19-vmem64-t1, s19-vmem56-t1]
    - [s19-vmem64-t1, s19-sabwd1k-t1]
    - [s19-vmem64-t1, s19-sabwd256-t1]
    - [s19-vmem64-t1, s19-combo-t1]
    - [s19-vmem48-t1, s19-vmem40-t1]
    - [s19-vmem48-t1, s19-vmem56-t1]
    - [s19-vmem48-t1, s19-sabwd1k-t1]
    - [s19-vmem48-t1, s19-sabwd256-t1]
    - [s19-vmem48-t1, s19-combo-t1]
    - [s19-vmem40-t1, s19-vmem56-t1]
    - [s19-vmem40-t1, s19-sabwd1k-t1]
    - [s19-vmem40-t1, s19-sabwd256-t1]
    - [s19-vmem40-t1, s19-combo-t1]
    - [s19-vmem56-t1, s19-sabwd1k-t1]
    - [s19-vmem56-t1, s19-sabwd256-t1]
    - [s19-vmem56-t1, s19-combo-t1]
    - [s19-sabwd1k-t1, s19-sabwd256-t1]
    - [s19-sabwd1k-t1, s19-combo-t1]
    - [s19-sabwd256-t1, s19-combo-t1]
include: [regression-common.yaml]
vars: {steps: 1000, window: "1:1001", units: 65000}
checks:
  # ---------------------------------------------------------------- R12 loss 序列（四个量 + 第一个不同的步）
  - id: R12.loss
    row: R12
    type: loss_series
    level: regress
    compare: lkg
    select: {kind: metrics, field: lm_loss, window: "1:1001"}
    threshold: exact
    params: {denominator: golden}

  # ---------------------------------------------------------------- R13 梯度范数（裁剪前）与参数范数序列
  - id: R13.{f}
    row: R13
    type: loss_series
    level: regress
    compare: lkg
    select: {kind: metrics, field: "{f}", window: "1:1001"}
    threshold: exact
    params: {denominator: golden}
    foreach: {f: [raw_grad_norm, param_norm]}

  # ---------------------------------------------------------------- R16① 路由偏置逐层统计（第 1–3 层）
  # 专家负载变异系数（router.load_cv）TPU 侧还没记（frameworks/maxtext/README.md「和 GPU 抓数的不同」），README 第七节列为缺口
  - id: R16.bias_stats
    row: R16
    type: router_stats
    level: regress
    compare: lkg
    select: {kind: metrics, prefix: "router.bias_", window: "1:1001"}
    threshold: exact
    params: {denominator: golden}

  # ---------------------------------------------------------------- R25 对齐门：对修好的 golden rcc（判）
  # 参照是两层验收的最终 golden rcc（GPU 生产程序只把输出头 dgrad 改成分段 FP32 累加；models/hunyuan3/goldens.md），
  # 与迁移验收 01 phase2-acceptance-rcc-on.yaml 的 L4.loss 同基线、同噪声、同窗口、同分母、同参数。2026-11-16 起由「对 g1k-a 只报」改为判
  # （hard: true）：被测对 rcc-a 的三个量 ≤ 1 倍噪声上限 pass、1–2 倍 inconclusive、> 2 倍 fail；
  # regress.py 再叠「不变差」（新值 − LKG 值 ≤ TPU 执行噪声上限），两者取较差。回归门逐位通过时继承 LKG，不看这一条。
  # baseline: rcc-a —— 只对验收事先定下的这一份算三个量，rcc-b..j 只组噪声带，不取平均、不取各份里最差（docs/reference/judging.md）
  # noise_from: golden —— runs.noise 是 TPU 执行噪声（给容差门用）；对 GPU golden 的噪声取 golden 两两（10 份 45 对），不换尺子
  # hard_limit.max_step —— 单步硬上限 = 10 × rcc 两两 45 对在 1:1001 窗口的最大单步上限 9.750e-4（标准「两条通用规则」）
  - id: R25.loss_vs_golden
    row: R25
    type: multi_golden
    level: regress
    select: {kind: metrics, field: lm_loss, window: "1:1001"}
    threshold: calibrated
    params: {signed_mean_se_k: 2, noise_from: golden, baseline: rcc-a, hard_limit: {max_step: 9.75e-3}}

  # ---------------------------------------------------------------- 容差门（role: tolerance，见 regression-common.yaml 末尾；噪声参照见上面 runs.noise）
  - id: R12.loss_tolerance
    row: R12
    role: tolerance
    type: loss_series
    level: regress
    hard: false
    compare: lkg
    select: {kind: metrics, field: lm_loss, window: "1:1001"}
    threshold: calibrated
    params: {denominator: golden}
  # 第 1 步梯度范数对 LKG（容差门；尺子是 GPU 重跑：修好的 golden rcc-a..j 第 1 步两两 45 对，noise_from: golden）。
  # 第 1 步还没有混沌放大，读到的是改动本身：变异测试里 1000 步序列的容差门分不开无害改动与真错（都在 1–1.5 倍），
  # 第 1 步梯度范数能分开（无害改动 ≤ 0.13 倍，关掉 RMSNorm 只舍一次 6.1 倍，eps 改一个量级 1400 倍）。
  # 只看 grad_norm 一项：GPU 第 1 步 loss 十份逐位相同（尺子为 0，给不出判定）。TPU 的 grad_norm 是裁剪前的范数，同 GPU
  - id: R09.step1_grad_norm_tolerance
    row: R09
    role: tolerance
    type: loss_series
    level: regress
    hard: false
    compare: lkg
    select: {kind: metrics, field: grad_norm, window: "1:2"}
    threshold: calibrated
    params: {denominator: golden, noise_from: golden, judge: first_step}
  - id: R13.{f}_tolerance
    row: R13
    role: tolerance
    type: loss_series
    level: regress
    hard: false
    compare: lkg
    select: {kind: metrics, field: "{f}", window: "1:1001"}
    threshold: calibrated
    params: {denominator: golden}
    foreach: {f: [raw_grad_norm, param_norm]}
  - id: R16.bias_stats_tolerance
    row: R16
    role: tolerance
    type: router_stats
    level: regress
    hard: false
    compare: lkg
    select: {kind: metrics, prefix: "router.bias_", window: "1:1001"}
    threshold: calibrated
    params: {denominator: golden}
